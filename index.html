<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0d0f;
            --surf: #18181b;
            --fg: #ececec;
            --mut: #8e8e96;
            --acc: #ff3d2e;
            --hot: #ff9a1f;
            --line: #2c2c31;
            --glass: rgba(24,24,27,.48);
            --glass-line: rgba(255,255,255,.09);
            color-scheme: dark
        }



        * {
            box-sizing: border-box;
            margin: 0
        }

        body {
            background: var(--bg);
            color: var(--fg);
            font: 400 1.0625rem/1.6 "Bricolage Grotesque",system-ui,sans-serif;
            -webkit-font-smoothing: antialiased
        }

        a {
            color: var(--acc)
        }

        :focus-visible {
            outline: 3px solid var(--acc);
            outline-offset: 3px
        }

        header {
            max-width: 1100px;
            margin: 0 auto;
            padding: clamp(2rem,6vw,5rem) 1.5rem 2.5rem;
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 2.5rem;
            align-items: end
        }

        h1 {
            font-size: clamp(2.8rem,8vw,5.5rem);
            line-height: .95;
            font-weight: 800;
            letter-spacing: -.035em
        }

        .title {
            color: var(--mut);
            margin-top: 1rem;
            font-size: 1.25rem
        }

        .links {
            display: flex;
            gap: 1.25rem;
            flex-wrap: wrap;
            margin-top: 1.5rem;
            padding: 0;
            list-style: none
        }

        .bio {
            display: grid;
            gap: 1rem;
            max-width: 60ch
        }

        .photo {
            justify-self: start;
            width: 9rem;
            aspect-ratio: 4/5;
            object-fit: cover;
            border-radius: 0;
            margin-bottom: .5rem;
            background: var(--surf)
        }

        .projects-head {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem
        }

        h2.section {
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -.02em
        }

        .arrows {
            display: flex;
            gap: .5rem
        }

            .arrows button {
                width: 2.75rem;
                height: 2.75rem;
                border-radius: 0;
                border: 1px solid var(--line);
                background: var(--surf);
                color: var(--fg);
                font-size: 1.25rem;
                cursor: pointer;
                transition: transform .25s cubic-bezier(.2,.8,.2,1), background-color .25s ease, opacity .25s ease
            }

        @media (hover:hover) {
            .arrows button:hover:not(:disabled) {
                background-color: #303036;
                transform: scale(1.06)
            }
        }

        .arrows button:disabled {
            opacity: .35;
            cursor: default
        }

        @media (prefers-reduced-motion:reduce) {
            .arrows button {
                transition: none
            }
        }

        .menu {
            position: relative;
            max-width: 1100px;
            margin: .15rem auto -.6rem;
            padding: .6rem 1.5rem;
            display: flex;
            gap: .5rem;
            overflow-x: auto;
            scrollbar-width: none
        }

            .menu button {
                background: var(--glass);
                -webkit-backdrop-filter: blur(16px) saturate(130%);
                backdrop-filter: blur(16px) saturate(130%);
                border: 1px solid var(--glass-line);
                border-radius: 0;
                border-bottom: 3px solid #4a4a52;
                color: var(--mut);
                font: inherit;
                padding: .7rem .9rem;
                cursor: pointer;
                white-space: nowrap;
                transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s ease, background-color .25s ease, color .25s ease, border-color .25s ease
            }

        @media (hover:hover) {
            .menu button:hover {
                background-color: rgba(78,78,86,.5);
                transform: scale(1.03)
            }
        }

        .menu button[aria-current=true] {
            color: var(--fg);
            font-weight: 700;
            border-bottom-color: var(--acc);
            transform: scale(1.04);
            z-index: 1;
            box-shadow: 0 0 16px rgba(255,61,46,.35), inset 0 0 14px rgba(255,61,46,.16)
        }

        @media (prefers-reduced-motion:reduce) {
            .menu button {
                transition: none
            }
        }

        .track {
            position: relative;
            display: flex;
            gap: 1.5rem;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
            padding: 1.75rem max(1.5rem,calc(50vw - 550px));
            scroll-padding-inline: max(1.5rem,calc(50vw - 550px));
            cursor: grab
        }

            .track::-webkit-scrollbar, .menu::-webkit-scrollbar {
                display: none
            }

            .track.drag {
                scroll-snap-type: none;
                cursor: grabbing;
                user-select: none
            }

        .slide {
            flex: 0 0 min(1000px,88vw);
            scroll-snap-align: start;
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 2rem;
            background: var(--glass);
            -webkit-backdrop-filter: blur(16px) saturate(130%);
            backdrop-filter: blur(16px) saturate(130%);
            border: 1px solid var(--glass-line);
            border-radius: 0;
            padding: 1.25rem
        }

        .media {
            aspect-ratio: 16/9;
            border-radius: 0;
            overflow: hidden;
            background: #000;
            display: grid;
            place-items: center
        }

            .media video, .media iframe {
                width: 100%;
                height: 100%;
                border: 0
            }

            .media img {
                width: 100%;
                height: 100%;
                object-fit: contain
            }

        .gallery {
            display: grid;
            gap: .6rem;
            align-content: start
        }

        .thumbs {
            display: flex;
            gap: .5rem;
            overflow-x: auto;
            scrollbar-width: none
        }

            .thumbs button {
                flex: 0 0 auto;
                width: 4.75rem;
                aspect-ratio: 16/9;
                padding: 0;
                border: 2px solid transparent;
                border-radius: 0;
                overflow: hidden;
                background: var(--bg);
                color: var(--fg);
                font: inherit;
                font-size: .85rem;
                cursor: pointer;
                opacity: .7
            }

                .thumbs button[aria-current=true] {
                    border-color: var(--acc);
                    opacity: 1
                }

            .thumbs img {
                display: block;
                width: 100%;
                height: 100%;
                object-fit: cover
            }

        .novid {
            color: var(--mut);
            padding: 1rem;
            text-align: center
        }

        .txt {
            display: flex;
            flex-direction: column;
            gap: .9rem;
            padding: .5rem .5rem .5rem 0
        }

        .date {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: .35rem .6rem;
            color: var(--mut);
            font-size: .95rem
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            padding-left: .6rem;
            border-left: 1px solid var(--line)
        }

            .status::before {
                content: "";
                width: .45rem;
                height: .45rem;
                border-radius: 50%;
                background: var(--mut);
                opacity: .6
            }

            .status[data-state=ongoing]::before {
                background: var(--hot);
                opacity: 1
            }

            .status[data-state=done]::before {
                background: #43c06a;
                opacity: 1
            }

        .txt h3 {
            font-size: clamp(1.7rem,3.2vw,2.3rem);
            line-height: 1.05;
            font-weight: 800;
            letter-spacing: -.025em
        }

        dl {
            margin-top: auto;
            border-top: 1px solid var(--line);
            padding-top: .9rem;
            display: grid;
            grid-template-columns: repeat(auto-fit,minmax(8.5rem,1fr));
            gap: .9rem 1.5rem
        }

        dt {
            color: var(--mut);
            font-size: .95rem
        }

        dd {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--hot)
        }

        footer {
            max-width: 1100px;
            margin: 0 auto;
            padding: 1rem 1.5rem 3rem;
            color: var(--mut);
            font-size: .95rem
        }

        @media (max-width:760px) {
            header {
                grid-template-columns: 1fr;
                gap: 1.5rem
            }

            .slide {
                grid-template-columns: 1fr;
                gap: 1rem
            }

            .txt {
                padding: 0 .25rem .25rem
            }
        }





        html {
            scroll-behavior: smooth;
            scroll-snap-type: y proximity
        }

        @media (prefers-reduced-motion:reduce) {
            html {
                scroll-behavior: auto
            }
        }

        .page {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            scroll-snap-align: start
        }

        .about header {
            width: min(1100px,calc(100% - 3rem));
            max-width: none;
            margin: auto;
            padding: clamp(1.5rem,4vw,3rem);
            align-items: center;
            background: var(--glass);
            -webkit-backdrop-filter: blur(16px) saturate(130%);
            backdrop-filter: blur(16px) saturate(130%);
            border: 1px solid var(--glass-line);
            border-radius: 0
        }

        .cue {
            align-self: center;
            padding: 1.5rem;
            color: var(--mut);
            text-decoration: none
        }

            .cue:hover {
                color: var(--fg)
            }

        #projects .body {
            margin-block: auto;
            padding-block: 2rem
        }

        footer {
            display: flex;
            justify-content: space-between;
            width: 100%
        }

        /* Diamond pattern: background only (z-index 0 < .page at 1), never above content */
        .grid-base, .grid-fx {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none
        }

        @media (hover:none) {
            .grid-fx {
                display: none
            }
        }
    </style>
</head>
<body>

    <section class="page about" id="about">
        <header>
            <div>
                <h1 id="name"></h1>
                <p class="title" id="title"></p>
                <ul class="links" id="links"></ul>
            </div>
            <div class="bio" id="bio"></div>
        </header>
        <a class="cue" href="#projects">Projects ↓</a>
    </section>

    <main class="page" id="projects">
        <div class="body">
            <div class="projects-head">
                <h2 class="section">Projects</h2>
                <div class="arrows">
                    <button id="prev" aria-label="Older project">‹</button>
                    <button id="next" aria-label="Newer project">›</button>
                </div>
            </div>
            <nav class="menu" id="menu" aria-label="Project list"></nav>
            <div class="track" id="track" tabindex="0" aria-label="Projects, oldest on the left, newest on the right"></div>
        </div>
        <footer><span id="copy"></span><a href="#about">↑ About</a></footer>
    </main>

    <canvas class="grid-base" id="gridBase" aria-hidden="true"></canvas>
    <canvas class="grid-fx" id="gridFx" aria-hidden="true"></canvas>

    <script>
        /* ====== EDIT THIS: your information ====== */
        const PROFILE = {
        name: "Ludwig Gurget",
        title: "23 y/o Gameplay Programmer (3rd-year student) specializing in C++ and C#.",
        // Portrait shown next to your bio. Put the image in the repo next to index.html
        // (default file name: photo.jpg). If the file is missing, no photo is shown.
        photo: "photo.jpg",
        bio: [
        "I design and program gameplay systems, editor tools and interactive experiences in Unity and Unreal Engine 5.",
        "I love small details that make a huge difference and well-crafted systems like an animation that reacts to the player, a tool that saves the team an hour, a prototype that holds together. And if a button could make you a coffee, I'd build it in a heartbeat",
        "Like many in this industry, my passion for video games naturally led me to study game development, where I gained some good technical foundation."
        ],
        links: [
        { label: "GitHub", url: "https://github.com/HiItsFeu" },
        { label: "LinkedIn", url: "https://www.linkedin.com/in/ludwig-gurget-769787261" },
        { label: "Contact", url: "mailto:l.gurget@gmail.com" }
        ]
        };

        /* One object per project.
        order    : display position. 1 = shown first (the page opens on it, on the right), 2 = the next one
        you reach by scrolling right, and so on. Projects without "order" come last, newest first.
        date     : "YYYY-MM" (shown on the slide, also used to break ties between equal orders)
        duration : free text, e.g. "3 weeks"
        team     : number of people who worked on the project, e.g. 1 (shown as "Solo") or 4 (shown as "4 people").
        Free text also works, e.g. "4 (2 programmers, 2 artists)". Leave null to hide the line.
        ongoing  : true if the project is still in production (shows "In progress" next to the date).
        Leave it out (or false) for a finished project (shows "Completed").
        video    : a YouTube link (youtube.com or youtu.be) OR a file in the repo, e.g. "videos/demo.mp4".
        Leave "" if there is none.
        videos   : (optional) several videos, same format as "video",
        e.g. ["https://youtu.be/AAAAAAAAAAA", "videos/demo.mp4"].
        You can use "video", "videos" or both (the single "video" comes first).
        photos   : list of images in the repo, e.g. ["images/shot1.jpg", "images/shot2.jpg"].
        They appear with the videos in a small gallery (videos first). Leave [] if there are none.
        link     : (optional) repository or project page */
        const PROJECTS = [
        { name: "CPU Engine", order: 1, date: "2026-10", duration: "4 weeks", team: "2",
        bio: "C++ software engine running entirely on the CPU using SDL3. Framebuffer management, custom rasterizer, multri-threading, blinn-phong lighting, multiple lights, terrain generation.",
        video: "https://youtu.be/hFcULMIPu58", photos: [], link: "" },
        { name: "A simple slime", order: 2, date: "2026-10", duration: "3 weeks", team: "2",
        bio: "A Unity game prototype focused on game feel and core gameplay mechanics, featuring a custom-built character controller.",
        video: "https://www.youtube.com/watch?v=g6VkB29s6fE", photos: [], link: "" },
        { name: "Fps prototype", order: 3, date: "2026-08", duration: "1 month", team: null,
        bio: "A compact FPS prototype built in Unreal Engine 4, created to test my ability to scope and execute a project under a strict timeline.",
        video: "https://www.youtube.com/watch?v=nlRbgm4-v0M", photos: [], link: "" },
        { name: "Guadeloupe: The Secret of the Three Rivers", order: 4, date: "2026-07", duration: "1 month", team: "4",
        bio: "Internship project at Black Frog Studio. An exploration game centered on Guadeloupe's rich folklore, where players travel across the island to solve its mysteries. Developed custom internal tools for level designers.",
        video: "https://www.youtube.com/watch?v=zlhlM9s28EE", photos: [], link: "" },
        { name: "Spline Tools (UE5)", order: 5, date: "2026-07", duration: "2 weeks", team: null,
        bio: "A suite of C++ and Blueprint editor tools for Unreal Engine 5, featuring terrain-spline snapping, curve-based movement, and highly configurable parameters.",
        videos: ["https://www.youtube.com/watch?v=yAbLEiAEBwk", "https://www.youtube.com/watch?v=c-JQNT7x82A"], photos: [], link: "" },
        { name: "Dialogue and Cutscene System", order: 6, date: "2026-06", duration: "1 week", team: null,
        bio: "A custom dialogue and cutscene system built for the Guadeloupe project in Unreal Engine using Level Sequences.",
        videos: ["https://www.youtube.com/watch?v=2vAAXGh2Jo8", "https://www.youtube.com/watch?v=SifTLRT01S0"], photos: [], link: "" },
        { name: "Turbo Drift 2", order: 7, date: "2026-05", duration: "Undefined", team: null, ongoing: true,
        bio: "A racing game derived from my student project Turbo Drift. As my most ambitious project to date, built in Unreal Engine 5.7, everything was created from scratch—from 3D art pipelines in Blender to core gameplay programming.",
        video: "", photos: ["Pictures/Test4.png" , "Pictures/SideView.png" , "Pictures/OrthoView.png" , "Pictures/TopView.png"], link: "" },
        { name: "Turbo Drift", order: 8, date: "2026-05", duration: "1 month", team: "6",
        bio: "A racing game prototype built on a custom C++ and Vulkan engine, featuring custom vehicle audio and 3D assets created by the art team.",
        videos: ["https://www.youtube.com/watch?v=UNN34BJ2Xj8", "https://www.youtube.com/watch?v=o79piqJLBgM"], photos: [], link: "" },
        { name: "LadyBug", order: 9, date: "2026-05", duration: "2 days", team: "4",
        bio: "A game jam entry that won the Jury's Choice Award.",
        video: "https://www.youtube.com/watch?v=B9UFAe060Mc", photos: [], link: "" }
        ];
        /* ====== End of the editable area ====== */

        const $ = id => document.getElementById(id);
        const el = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };
        const monthFmt = new Intl.DateTimeFormat("en", { month: "long", year: "numeric" });
        const ytId = u => (u.match(/(?:youtu\.be\/|[?&]v=|embed\/)([\w-]{11})/) || [])[1];
        const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;

        /* Profile */
        document.title = PROFILE.name + " – Portfolio";
        $("name").textContent = PROFILE.name;
        $("title").textContent = PROFILE.title;
        if (PROFILE.photo) {
        const img = el("img", "photo");
        img.src = PROFILE.photo; img.alt = "Portrait of " + PROFILE.name;
        img.onerror = () => img.remove();
        $("bio").append(img);
        }
        PROFILE.bio.forEach(p => $("bio").append(el("p", "", p)));
        PROFILE.links.forEach(l => {
        const li = el("li"), a = el("a", "", l.label);
        a.href = l.url;
        if (!l.url.startsWith("mailto:")) { a.target = "_blank"; a.rel = "noopener"; }
        li.append(a); $("links").append(li);
        });
        $("copy").textContent = "© " + new Date().getFullYear() + " " + PROFILE.name;

        /* Projects: order 1 on the right, following orders to its left */
        const projects = [...PROJECTS]
        .sort((a, b) => ((a.order ?? Infinity) - (b.order ?? Infinity)) || b.date.localeCompare(a.date))
        .reverse(); // order 1 ends up on the far right
        const track = $("track"), menu = $("menu");
        const slides = [], tabs = [];
        let active = projects.length - 1;

        projects.forEach((p, i) => {
        const s = el("article", "slide");
        const items = [];
        const vids = [p.video, ...(p.videos || [])].filter(Boolean);
        vids.forEach((v, n) => items.push({ video: v, label: vids.length > 1 ? "Video " + (n + 1) : "Video" }));
        (p.photos || []).forEach((src, n) => items.push({ src, alt: p.name + " – photo " + (n + 1) }));
        const gallery = el("div", "gallery"), media = el("div", "media"), thumbs = el("div", "thumbs"), thumbBtns = [];
        gallery.append(media);
        const show = k => {
        const it = items[k], yt = it.video && ytId(it.video);
        let node;
        if (yt) {
        node = el("iframe");
        node.src = "https://www.youtube-nocookie.com/embed/" + yt;
        node.title = "Demo: " + p.name + (vids.length > 1 ? " – " + it.label : ""); node.loading = "lazy"; node.allowFullscreen = true;
        node.allow = "accelerometer; encrypted-media; picture-in-picture; fullscreen";
        } else if (it.video) {
        node = el("video"); node.src = it.video; node.controls = true; node.preload = "metadata"; node.playsInline = true;
        } else {
        node = el("img"); node.src = it.src; node.alt = it.alt;
        }
        media.replaceChildren(node);
        thumbBtns.forEach((b, j) => b.setAttribute("aria-current", j === k));
        };
        if (!items.length) {
        media.append(el("p", "novid", "Demo video coming soon"));
        } else {
        if (items.length > 1) {
        items.forEach((it, k) => {
        const b = el("button");
        if (it.video) b.textContent = "▶ " + it.label;
        else { const im = el("img"); im.src = it.src; im.alt = ""; im.loading = "lazy"; b.append(im); }
        b.setAttribute("aria-label", it.video ? "Demo " + it.label.toLowerCase() : it.alt);
        b.addEventListener("click", () => show(k));
        thumbs.append(b); thumbBtns.push(b);
        });
        gallery.append(thumbs);
        }
        show(0);
        }
        const txt = el("div", "txt");
        const meta = el("p", "date", monthFmt.format(new Date(p.date + "-01T12:00:00")));
        const status = el("span", "status", p.ongoing ? "In progress" : "Completed");
        status.dataset.state = p.ongoing ? "ongoing" : "done";
        meta.append(status);
        txt.append(meta, el("h3", "", p.name), el("p", "", p.bio));
        const dl = el("dl");
        const stat = (label, value) => { const d = el("div"); d.append(el("dt", "", label), el("dd", "", value)); dl.append(d); };
        stat("Production time", p.duration);
        if (p.team != null && p.team !== "") stat("Team size", typeof p.team === "number" ? (p.team === 1 ? "Solo" : p.team + " people") : p.team);
        txt.append(dl);
        if (p.link) { const a = el("a", "", "View project"); a.href = p.link; a.target = "_blank"; a.rel = "noopener"; txt.append(a); }
        s.append(gallery, txt); track.append(s); slides.push(s);

        const t = el("button", "", p.name);
        t.addEventListener("click", () => go(i));
        menu.append(t); tabs.push(t);
        });

        const padLeft = () => parseFloat(getComputedStyle(track).paddingLeft);
        const behavior = instant => (instant || calm) ? "auto" : "smooth";
        function go(i, instant) {
        i = Math.max(0, Math.min(slides.length - 1, i));
        track.scrollTo({ left: slides[i].offsetLeft - padLeft(), behavior: behavior(instant) });
        }
        function update(i, instant) {
        active = i;
        tabs.forEach((t, j) => t.setAttribute("aria-current", j === i));
        const t = tabs[i];
        menu.scrollTo({ left: t.offsetLeft - (menu.clientWidth - t.offsetWidth) / 2, behavior: behavior(instant) });
        $("prev").disabled = i === 0;
        $("next").disabled = i === slides.length - 1;
        slides.forEach((s, j) => { if (j !== i) s.querySelectorAll("video").forEach(v => v.pause()); });
        }
        let raf;
        track.addEventListener("scroll", () => {
        cancelAnimationFrame(raf);
        raf = requestAnimationFrame(() => {
        const x = track.scrollLeft, g = padLeft();
        let i = slides.reduce((m, s, j) => Math.abs(s.offsetLeft - g - x) < Math.abs(slides[m].offsetLeft - g - x) ? j : m, 0);
        if (x >= track.scrollWidth - track.clientWidth - 2) i = slides.length - 1;
        if (i !== active) update(i);
        });
        });
        $("prev").addEventListener("click", () => go(active - 1));
        $("next").addEventListener("click", () => go(active + 1));
        track.addEventListener("keydown", e => {
        if (e.key === "ArrowLeft") { e.preventDefault(); go(active - 1); }
        if (e.key === "ArrowRight") { e.preventDefault(); go(active + 1); }
        });

        /* Mouse drag (touch scrolling is native) */
        let drag = null;
        track.addEventListener("pointerdown", e => {
        if (e.pointerType !== "mouse" || e.target.closest("video,iframe,a,button")) return;
        drag = { x: e.clientX, s: track.scrollLeft };
        track.classList.add("drag"); track.setPointerCapture(e.pointerId);
        });
        track.addEventListener("pointermove", e => { if (drag) track.scrollLeft = drag.s - (e.clientX - drag.x); });
        const endDrag = () => { if (!drag) return; drag = null; track.classList.remove("drag"); go(active); };
        track.addEventListener("pointerup", endDrag);
        track.addEventListener("pointercancel", endDrag);

        /* Open on the newest project */
        update(active, true);
        go(active, true);

        /* Diamond pattern on the whole background. Only the diamonds near the mouse light up and emit light */
        (() => {
        const CELL = 16;              // half-diagonal of the lattice step: smaller = finer pattern
        const RADIUS = 280;           // range of the light around the mouse (px)
        const BASE = 0.26;            // diamond size at rest (1 = touching neighbours)
        const MAX = 0.9;              // diamond size right under the mouse: they grow smoothly from BASE to MAX
        const BASE_RIM = "rgba(255,255,255,.05)";   // resting outline (the diamonds are outlines only, no interior)
        const RIM = "240,160,115";    // luminous outline of lit diamonds
        const LIGHT = "190,62,28";    // light cast on the background by lit diamonds
        const LIGHT_DIV = 8;          // the light is drawn at 1/8 resolution, blurred, then upscaled
        const STEPS = 16;             // brightness levels while a diamond lights up (more = smoother fade)
        const MAX_FPS = 60;           // frame cap of the animation (0 = follow the screen refresh rate)
        const FRINGE = 110;           // px around the lit diamonds reached by their light: only this area is redrawn
        const fine = matchMedia("(hover: hover) and (pointer: fine)").matches;
        const baseCv = $("gridBase"), bctx = baseCv.getContext("2d");
        const cv = $("gridFx"), ctx = cv.getContext("2d");
        const lc = document.createElement("canvas"), lctx = lc.getContext("2d");

        /* Colour strings built once instead of every frame */
        const LIGHT_STYLE = Array.from({ length: 256 }, (_, q) => "rgba(" + LIGHT + "," + (.38 * (q / 255) * (q / 255)).toFixed(3) + ")");
        const RIM_STYLE = Array.from({ length: STEPS }, (_, b) => "rgba(" + RIM + "," + (.62 * (b + 1) / STEPS).toFixed(3) + ")");
        const GLOW_ALPHA = [.3, .55, .8];
        const BG = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim() || "#0d0d0f";
        const MASK_R = BASE * CELL + 3;   // covers the resting outline of a diamond while it is lit

        let W = 0, H = 0, dpr = 1, cols = 0, rows = 0;
        let lit = new Float32Array(0), pts = new Float32Array(0), act = new Uint32Array(0), nxt = new Uint32Array(0);
        let actN = 0, n = 0, nN = 0, prev = null;
        let mx = 0, my = 0, tx = 0, ty = 0, inside = false, running = false, last = 0;
        let grow = 1, shrink = 1, changed = false, minX = 0, maxX = 0, minY = 0, maxY = 0;

        const diamond = (path, x, y, r) => { path.moveTo(x, y - r); path.lineTo(x + r, y); path.lineTo(x, y + r); path.lineTo(x - r, y); path.closePath(); };
        const fit = (c, x) => { c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); x.setTransform(dpr, 0, 0, dpr, 0, 0); };

        /* Resting pattern: drawn once per size, outlines only, barely lighter than the background */
        function drawBase() {
        const body = new Path2D(), r = BASE * CELL, OFF = 4000;
        for (let j = 0; j < rows; j++) for (let i = j & 1; i < cols; i += 2) diamond(body, i * CELL, j * CELL, r);
        bctx.clearRect(0, 0, W, H);
        bctx.lineWidth = .75;
        bctx.save();
        bctx.translate(-OFF, 0);
        bctx.shadowColor = "rgba(0,0,0,.4)"; bctx.shadowBlur = 4 * dpr; bctx.shadowOffsetX = (OFF + 1) * dpr; bctx.shadowOffsetY = 2 * dpr;
        bctx.strokeStyle = "#000"; bctx.stroke(body);
        bctx.restore();
        bctx.strokeStyle = BASE_RIM; bctx.stroke(body);
        }

        function resize() {
        dpr = Math.min(devicePixelRatio || 1, 2);
        W = innerWidth; H = innerHeight;
        cols = Math.ceil(W / CELL) + 2; rows = Math.ceil(H / CELL) + 2;
        fit(baseCv, bctx); drawBase();
        if (!fine) return;
        fit(cv, ctx);
        ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
        lc.width = Math.ceil(W / LIGHT_DIV); lc.height = Math.ceil(H / LIGHT_DIV);
        lit = new Float32Array(cols * rows);
        pts = new Float32Array(cols * rows * 3);
        act = new Uint32Array(cols * rows); nxt = new Uint32Array(cols * rows);
        actN = 0; prev = null;
        }

        /* The animation only runs while something changes: it stops once the diamonds have settled */
        const start = () => { if (!running) { running = true; last = 0; requestAnimationFrame(frame); } };
        let rt;
        addEventListener("resize", () => {
        clearTimeout(rt);
        rt = setTimeout(() => { resize(); if (fine && inside) start(); }, 120);
        });
        resize();
        if (!fine) return;

        /* Updates one diamond's light level and records it if it is visible */
        function upd(k, cx, cy, target) {
        const o = lit[k];
        let l = o + (target - o) * (target > o ? grow : shrink);
        if (l < .01) l = 0;
        lit[k] = l;
        const dl = l - o;
        if (dl > 2e-4 || dl < -2e-4) changed = true;
        if (l > 0) {
        nxt[nN++] = k; pts[n++] = cx; pts[n++] = cy; pts[n++] = l;
        if (cx < minX) minX = cx; if (cx > maxX) maxX = cx; if (cy < minY) minY = cy; if (cy > maxY) maxY = cy;
        }
        }

        function frame(now) {
        if (MAX_FPS && last && now - last < 1000 / MAX_FPS - 4) { requestAnimationFrame(frame); return; }
        const dt = last ? Math.min((now - last) / 16.67, 4) : 1;
        last = now;
        const follow = calm ? 1 : 1 - Math.pow(1 - .4, dt);
        mx += (tx - mx) * follow; my += (ty - my) * follow;
        grow = calm ? 1 : 1 - Math.pow(1 - .35, dt); shrink = calm ? 1 : 1 - Math.pow(1 - .07, dt);
        changed = Math.abs(tx - mx) > .5 || Math.abs(ty - my) > .5;
        n = 0; nN = 0; minX = minY = Infinity; maxX = maxY = -Infinity;

        /* 1. light level of the diamonds: only those near the mouse and those still fading are visited */
        let i0 = 0, i1 = -1, j0 = 0, j1 = -1;
        if (inside) {
        i0 = Math.max(0, Math.floor((mx - RADIUS) / CELL)); i1 = Math.min(cols - 1, Math.ceil((mx + RADIUS) / CELL));
        j0 = Math.max(0, Math.floor((my - RADIUS) / CELL)); j1 = Math.min(rows - 1, Math.ceil((my + RADIUS) / CELL));
        for (let j = j0; j <= j1; j++) {
        const cy = j * CELL, dy = cy - my;
        for (let i = i0 + ((i0 ^ j) & 1); i <= i1; i += 2) {
        const cx = i * CELL, dx = cx - mx;
        let target = 0;
        if (dx > -RADIUS && dx < RADIUS && dy > -RADIUS && dy < RADIUS) {
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d < RADIUS) target = Math.pow(1 - d / RADIUS, 1.3);
        }
        upd(j * cols + i, cx, cy, target);
        }
        }
        }
        for (let a = 0; a < actN; a++) {
        const k = act[a], j = (k / cols) | 0, i = k - j * cols;
        if (inside && i >= i0 && i <= i1 && j >= j0 && j <= j1) continue;
        upd(k, i * CELL, j * CELL, 0);
        }
        const swap = act; act = nxt; nxt = swap; actN = nN;

        /* Area to redraw (in light-canvas pixels): where diamonds are now, plus where they were */
        const M = FRINGE;
        const cur = n ? [Math.max(0, Math.floor((minX - M) / LIGHT_DIV)), Math.max(0, Math.floor((minY - M) / LIGHT_DIV)),
        Math.min(lc.width, Math.ceil((maxX + M) / LIGHT_DIV)), Math.min(lc.height, Math.ceil((maxY + M) / LIGHT_DIV))] : null;
        const u = cur && prev ? [Math.min(cur[0], prev[0]), Math.min(cur[1], prev[1]), Math.max(cur[2], prev[2]), Math.max(cur[3], prev[3])] : (cur || prev);
        if (u) {
        lctx.clearRect(u[0], u[1], u[2] - u[0], u[3] - u[1]);
        ctx.clearRect(u[0] * LIGHT_DIV, u[1] * LIGHT_DIV, (u[2] - u[0]) * LIGHT_DIV, (u[3] - u[1]) * LIGHT_DIV);
        }
        prev = cur;

        if (n) {
        /* 2. group the lit diamonds by brightness level */
        const levels = new Array(STEPS), glow = [null, null, null], shade = new Path2D(), mask = new Path2D();
        for (let p = 0; p < n; p += 3) {
        const x = pts[p], y = pts[p + 1], l = pts[p + 2], r = (BASE + (MAX - BASE) * l) * CELL;
        const b = Math.min(STEPS - 1, Math.floor(Math.min(1, l * 1.4) * STEPS));
        diamond(levels[b] || (levels[b] = new Path2D()), x, y, r);
        diamond(shade, x, y, r);
        diamond(mask, x, y, MASK_R);
        if (l > .25) { const g = l > .75 ? 2 : l > .5 ? 1 : 0; diamond(glow[g] || (glow[g] = new Path2D()), x, y, r); }
        }

        /* 3. a lit diamond is the resting one growing: hide the resting outline underneath */
        ctx.fillStyle = BG; ctx.fill(mask);

        /* 4. light cast on the background by the lit diamonds */
        lctx.shadowColor = "rgba(" + LIGHT + ",.9)"; lctx.shadowBlur = 5;
        for (let p = 0; p < n; p += 3) {
        const l = pts[p + 2];
        if (l < .05) continue;
        const x = pts[p] / LIGHT_DIV, y = pts[p + 1] / LIGHT_DIV, r = (BASE + (MAX - BASE) * l) * CELL * 1.5 / LIGHT_DIV;
        lctx.fillStyle = LIGHT_STYLE[(l * 255 + .5) | 0];
        lctx.beginPath(); lctx.moveTo(x, y - r); lctx.lineTo(x + r, y); lctx.lineTo(x, y + r); lctx.lineTo(x - r, y); lctx.closePath();
        lctx.fill();
        }
        ctx.drawImage(lc, cur[0], cur[1], cur[2] - cur[0], cur[3] - cur[1],
        cur[0] * LIGHT_DIV, cur[1] * LIGHT_DIV, (cur[2] - cur[0]) * LIGHT_DIV, (cur[3] - cur[1]) * LIGHT_DIV);

        /* 5. very light drop shadow of the outlines (drawn off-screen so only the shadow shows) */
        ctx.lineWidth = 1.25; ctx.lineJoin = "miter";
        const OFF = 4000;
        ctx.save();
        ctx.translate(-OFF, 0);
        ctx.shadowColor = "rgba(0,0,0,.3)"; ctx.shadowBlur = 5 * dpr; ctx.shadowOffsetX = (OFF + 1) * dpr; ctx.shadowOffsetY = 2.5 * dpr;
        ctx.strokeStyle = "#000"; ctx.stroke(shade);
        ctx.restore();

        /* 6. luminous outlines only (no interior), brighter levels last */
        for (let b = 0; b < STEPS; b++) {
        if (!levels[b]) continue;
        ctx.strokeStyle = RIM_STYLE[b]; ctx.stroke(levels[b]);
        }
        ctx.save();
        ctx.strokeStyle = "rgba(" + RIM + ",.8)"; ctx.shadowColor = "rgba(215,115,65,.6)"; ctx.shadowBlur = 4 * dpr;
        for (let g = 0; g < 3; g++) if (glow[g]) { ctx.globalAlpha = GLOW_ALPHA[g]; ctx.stroke(glow[g]); }
        ctx.restore();
        }

        if (changed || (!inside && n)) requestAnimationFrame(frame);
        else { running = false; last = 0; }
        }

        addEventListener("pointermove", e => {
        if (e.pointerType !== "mouse") return;
        tx = e.clientX; ty = e.clientY;
        if (!inside) { inside = true; if (!running) { mx = tx; my = ty; } }
        start();
        });
        document.documentElement.addEventListener("pointerleave", () => { inside = false; if (prev) start(); });
        })();
    </script>
</body>
</html>
