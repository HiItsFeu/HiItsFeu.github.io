<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ludwig Gurget – Gameplay Programmer Portfolio</title>
    <meta name="description" content="Ludwig Gurget, gameplay programmer specializing in C++ and C#. Games, editor tools and prototypes in Unity and Unreal Engine 5.">
    <meta name="theme-color" content="#0d0d0f">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Ludwig Gurget – Gameplay Programmer">
    <meta property="og:description" content="Games, editor tools and prototypes in Unity and Unreal Engine 5.">
    <meta name="twitter:card" content="summary_large_image">
    <!-- Link preview image: once the site is online, add
         <meta property="og:image" content="https://YOUR-SITE/Pictures/preview.jpg">  (absolute URL, about 1200x630) -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230d0d0f'/%3E%3Cpath d='M16 4l12 12-12 12L4 16z' fill='none' stroke='%23ff3d2e' stroke-width='3'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://i.ytimg.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0d0f;
            --surf: #18181b;
            --fg: #ececec;
            --mut: #8e8e96;
            --acc: #ff3d2e;
            --hot: #ff9a1f;
            --line: #2c2c31;
            --glass: rgba(24,24,27,.42);
            --glass-fx: blur(5px) saturate(125%); /* one shared frosted-glass look: squares stay visible but soft */
            --glass-line: rgba(255,255,255,.09);
            color-scheme: dark
        }



        * {
            box-sizing: border-box;
            margin: 0
        }

        body {
            background: var(--bg);
            color: var(--fg);
            font: 400 1.0625rem/1.6 "Bricolage Grotesque",system-ui,sans-serif;
            -webkit-font-smoothing: antialiased
        }

        a {
            color: var(--acc)
        }

        :focus-visible {
            outline: 3px solid var(--acc);
            outline-offset: 3px
        }

        header {
            max-width: 1100px;
            margin: 0 auto;
            padding: clamp(2rem,6vw,5rem) 1.5rem 2.5rem;
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 2.5rem;
            align-items: end
        }

        h1 {
            font-size: clamp(2.8rem,8vw,5.5rem);
            line-height: .95;
            font-weight: 800;
            letter-spacing: -.035em
        }

        .title {
            color: var(--mut);
            margin-top: 1rem;
            font-size: 1.25rem
        }

        .links {
            display: flex;
            gap: 1.25rem;
            flex-wrap: wrap;
            margin-top: 1.5rem;
            padding: 0;
            list-style: none
        }

        .bio {
            display: grid;
            gap: 1rem;
            max-width: 60ch
        }

        .photo {
            justify-self: start;
            width: 9rem;
            aspect-ratio: 4/5;
            object-fit: cover;
            border-radius: 0;
            margin-bottom: .5rem;
            background: var(--surf)
        }

        .projects-head {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem
        }

        h2.section {
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -.02em
        }

        .arrows {
            display: flex;
            flex-direction: column;
            gap: .5rem;
            flex: none
        }

            .arrows button {
                width: 2.75rem;
                height: 2.75rem;
                background: var(--glass);
                -webkit-backdrop-filter: var(--glass-fx);
                backdrop-filter: var(--glass-fx);
                border: 1px solid var(--glass-line);
                border-bottom: 3px solid #4a4a52;
                border-radius: 0;
                color: var(--fg);
                font-size: 1.25rem;
                cursor: pointer;
                transition: transform .25s cubic-bezier(.2,.8,.2,1), background-color .25s ease, border-color .25s ease, opacity .25s ease
            }

        @media (hover:hover) {
            .arrows button:hover:not(:disabled) {
                background-color: rgba(78,78,86,.5);
                border-color: var(--acc);
                transform: scale(1.06)
            }
        }

        .arrows button:disabled {
            opacity: .35;
            cursor: default
        }

        @media (prefers-reduced-motion:reduce) {
            .arrows button {
                transition: none
            }
        }

        .menu {
            position: relative;
            max-width: 1100px;
            margin: .15rem auto -.6rem;
            padding: .6rem 1.5rem;
            display: flex;
            gap: .5rem;
            overflow-x: auto;
            scrollbar-width: none
        }

            .menu button {
                background: var(--glass);
                -webkit-backdrop-filter: var(--glass-fx);
                backdrop-filter: var(--glass-fx);
                border: 1px solid var(--glass-line);
                border-radius: 0;
                border-bottom: 3px solid #4a4a52;
                color: var(--mut);
                font: inherit;
                padding: .7rem .9rem;
                cursor: pointer;
                white-space: nowrap;
                transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s ease, background-color .25s ease, color .25s ease, border-color .25s ease
            }

        @media (hover:hover) {
            .menu button:hover {
                background-color: rgba(78,78,86,.5);
                transform: scale(1.03)
            }
        }

        .menu button[aria-current=true] {
            color: var(--fg);
            font-weight: 700;
            border-color: rgba(255,106,43,.55);
            border-bottom-color: var(--acc);
            transform: scale(1.04);
            z-index: 1
        }

        @media (hover:hover) {
            .menu button:hover {
                border-color: var(--acc)
            }
        }

        @media (prefers-reduced-motion:reduce) {
            .menu button {
                transition: none
            }
        }

        .menu::-webkit-scrollbar {
            display: none
        }

        .slide {
            grid-area: 1 / 1;
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 2rem;
            background: var(--glass);
            -webkit-backdrop-filter: var(--glass-fx);
            backdrop-filter: var(--glass-fx);
            border: 1px solid var(--glass-line);
            border-radius: 0;
            padding: 1.25rem
        }

        .media {
            aspect-ratio: 16/9;
            border-radius: 0;
            overflow: hidden;
            background: #000;
            display: grid;
            place-items: center
        }

            .media video, .media iframe {
                width: 100%;
                height: 100%;
                border: 0
            }

            .media img {
                width: 100%;
                height: 100%;
                object-fit: contain
            }

        .gallery {
            display: grid;
            gap: .6rem;
            align-content: start
        }

        .thumbs {
            display: flex;
            gap: .5rem;
            overflow-x: auto;
            scrollbar-width: none
        }

            .thumbs button {
                flex: 0 0 auto;
                width: 4.75rem;
                aspect-ratio: 16/9;
                padding: 0;
                border: 2px solid transparent;
                border-radius: 0;
                overflow: hidden;
                background: var(--bg);
                color: var(--fg);
                font: inherit;
                font-size: .85rem;
                cursor: pointer;
                opacity: .7
            }

                .thumbs button[aria-current=true] {
                    border-color: var(--acc);
                    opacity: 1
                }

            .thumbs img {
                display: block;
                width: 100%;
                height: 100%;
                object-fit: cover
            }

        .novid {
            color: var(--mut);
            padding: 1rem;
            text-align: center
        }

        .txt {
            display: flex;
            flex-direction: column;
            gap: .9rem;
            padding: .5rem .5rem .5rem 0
        }

        .date {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: .35rem .6rem;
            color: var(--mut);
            font-size: .95rem
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            padding-left: .6rem;
            border-left: 1px solid var(--line)
        }

            .status::before {
                content: "";
                width: .45rem;
                height: .45rem;
                border-radius: 50%;
                background: var(--mut);
                opacity: .6
            }

            .status[data-state=ongoing]::before {
                background: var(--hot);
                opacity: 1
            }

            .status[data-state=done]::before {
                background: #43c06a;
                opacity: 1
            }

        .txt h3 {
            font-size: clamp(1.7rem,3.2vw,2.3rem);
            line-height: 1.05;
            font-weight: 800;
            letter-spacing: -.025em
        }

        dl {
            margin-top: auto;
            border-top: 1px solid var(--line);
            padding-top: .9rem;
            display: grid;
            grid-auto-flow: column;
            grid-auto-columns: minmax(0,1fr);
            gap: .9rem 1.5rem
        }

        dt {
            color: var(--mut);
            font-size: .95rem
        }

        dd {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--hot)
        }

        .team {
            container-type: inline-size;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: .1rem .3rem;
            min-height: calc(1.4rem * 1.6)
        }

            /* --n = number of icons: each one takes its share of the free width, between .8rem and 1.45rem */
            .team svg {
                display: block;
                flex: none;
                width: clamp(.8rem, calc((100cqw - (var(--n) - 1) * .3rem) / var(--n)), 1.45rem);
                aspect-ratio: 1;
                height: auto;
                fill: currentColor
            }

        footer {
            max-width: 1100px;
            margin: 0 auto;
            padding: 1rem 1.5rem clamp(1rem,4svh,3rem);
            color: var(--mut);
            font-size: .95rem
        }

        @media (max-width:760px) {
            header {
                grid-template-columns: 1fr;
                gap: 1.5rem
            }

            .slide {
                grid-template-columns: 1fr;
                gap: 1rem
            }

            .txt {
                padding: 0 .25rem .25rem
            }
        }





        html {
            scroll-behavior: smooth
        }

        @media (prefers-reduced-motion:reduce) {
            html {
                scroll-behavior: auto
            }
        }

        .page {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            flex-direction: column
        }

        .about header {
            width: min(1100px,calc(100% - 3rem));
            max-width: none;
            margin: auto;
            padding: clamp(1.5rem,4vw,3rem);
            align-items: center;
            background: var(--glass);
            -webkit-backdrop-filter: var(--glass-fx);
            backdrop-filter: var(--glass-fx);
            border: 1px solid var(--glass-line);
            border-radius: 0
        }

        .cue {
            align-self: center;
            padding: 1.5rem;
            color: var(--mut);
            text-decoration: none
        }

            .cue:hover {
                color: var(--fg)
            }

        #projects .body {
            margin-block: auto;
            padding-block: clamp(.5rem,3svh,2rem)
        }

        footer {
            display: flex;
            justify-content: space-between;
            width: 100%
        }

        /* Diamond pattern: background only (z-index 0 < .page at 1), never above content */
        .grid-base, .grid-fx {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none
        }

        @media (hover:none) {
            .grid-fx {
                display: none
            }
        }

        /* ===== Vertical wheel + timeline ===== */
        .stage {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 1.5rem;
            display: grid;
            grid-template-columns: 8rem minmax(0,1fr);
            column-gap: 1.75rem
        }

        .deck {
            display: flex;
            align-items: center;
            gap: 1rem;
            min-width: 0
        }

        /* Timeline: detached from the projects by the grid gap; the scale is readable (neighbouring dates are labelled) */
        .timeline {
            position: relative;
            overflow: hidden;
            -webkit-mask-image: linear-gradient(transparent, #000 18%, #000 82%, transparent);
            mask-image: linear-gradient(transparent, #000 18%, #000 82%, transparent)
        }

            .timeline::after {
                content: "";
                position: absolute;
                right: 0;
                top: 0;
                bottom: 0;
                width: 2px;
                background: rgba(255,255,255,.2)
            }

        .ticks i {
            position: absolute;
            right: 0;
            top: 50%;
            width: .7rem;
            height: 2px;
            background: rgba(255,255,255,.5)
        }

            .ticks i span {
                font-style: normal;
                position: absolute;
                right: calc(100% + .7rem);
                top: 50%;
                transform: translateY(-50%);
                white-space: nowrap;
                font-size: .82rem;
                line-height: 1;
                font-weight: 700;
                font-variant-numeric: tabular-nums;
                color: #b4b4bc;
                text-shadow: 0 0 10px var(--bg), 0 0 4px var(--bg)
            }

        .mark {
            position: absolute;
            right: 0;
            top: 50%;
            width: 1.6rem;
            height: 4px;
            margin-top: -2px;
            background: var(--acc);
            box-shadow: 0 0 12px rgba(255,61,46,.55)
        }

        .when {
            position: absolute;
            right: 2.2rem;
            top: 50%;
            transform: translateY(-50%);
            text-align: right;
            line-height: 1;
            text-shadow: 0 0 12px var(--bg), 0 0 4px var(--bg)
        }

            .when .m {
                display: block;
                font-size: 1.7rem;
                font-weight: 800;
                letter-spacing: -.02em;
                color: var(--fg)
            }

            .when .y {
                display: block;
                margin-top: .3rem;
                font-size: 1rem;
                font-weight: 700;
                color: var(--hot)
            }

        .wheel {
            --peek: clamp(2rem, 7svh, 3.75rem);
            width: min(100%, 1000px, max(560px, calc(1000px - (700px - 100svh) * 3)));
            flex: 0 1 auto;
            min-width: 0;
            display: grid;
            grid-template-columns: minmax(0,1fr);
            padding-block: var(--peek);
            overflow: hidden;
            perspective: 1400px;
            touch-action: none;
            cursor: grab
            /* no mask here: a mask on an ancestor would stop the slides' backdrop blur from seeing the diamond background.
               The fade at the top and bottom is done by each slide's own opacity instead (see draw()) */
        }

            .wheel.drag {
                cursor: grabbing;
                user-select: none
            }

        .date .status {
            padding-left: 0;
            border-left: 0
        }

        @media (max-width:760px) {
            .stage {
                grid-template-columns: 2.4rem minmax(0,1fr);
                column-gap: .6rem;
                padding: 0 1rem
            }

            .deck {
                gap: .5rem
            }

            .arrows button {
                width: 2.25rem;
                height: 2.25rem
            }

            .mark {
                width: .9rem
            }

            .ticks i span {
                display: none
            }

            .when {
                right: 1rem;
                writing-mode: vertical-rl;
                transform: translateY(-50%) rotate(180deg);
                white-space: nowrap
            }

                .when .m, .when .y {
                    display: inline;
                    font-size: .95rem
                }

                .when .y {
                    margin: 0 0 0 .4em
                }
        }


        /* ===== Roles, tags, action buttons ===== */
        .role {
            color: var(--hot);
            font-weight: 700;
            font-size: 1rem;
            margin-top: -.45rem
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: .4rem;
            padding: 0;
            list-style: none
        }

            .tags li {
                font-size: .8rem;
                color: var(--mut);
                border: 1px solid var(--line);
                padding: .05rem .5rem
            }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: .6rem
        }

        .btn {
            display: inline-block;
            background: var(--glass);
            -webkit-backdrop-filter: var(--glass-fx);
            backdrop-filter: var(--glass-fx);
            border: 1px solid var(--glass-line);
            border-bottom: 3px solid #4a4a52;
            border-radius: 0;
            color: var(--fg);
            font: inherit;
            font-size: .95rem;
            padding: .45rem .9rem;
            text-decoration: none;
            cursor: pointer;
            transition: background-color .25s ease, border-color .25s ease
        }

            .btn.primary {
                border-bottom-color: var(--acc)
            }

            .btn.small {
                font-size: .85rem;
                padding: .3rem .7rem;
                justify-self: start
            }

        @media (hover:hover) {
            .btn:hover {
                background-color: rgba(78,78,86,.5);
                border-color: var(--acc)
            }
        }

        /* ===== Filter chips (project filter + skills) ===== */
        .chip {
            font: inherit;
            font-size: .85rem;
            color: var(--mut);
            background: transparent;
            border: 1px solid var(--line);
            border-radius: 0;
            padding: .2rem .7rem;
            cursor: pointer;
            transition: color .2s ease, border-color .2s ease
        }

        @media (hover:hover) {
            .chip:hover {
                color: var(--fg);
                border-color: var(--acc)
            }
        }

        .chip[aria-pressed=true] {
            color: var(--fg);
            border-color: var(--acc)
        }

        .filters {
            max-width: 1100px;
            margin: .9rem auto 0;
            padding: 0 1.5rem;
            display: flex;
            flex-wrap: wrap;
            gap: .4rem
        }

            .filters:empty {
                display: none
            }

        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: .4rem;
            margin-top: 1.5rem
        }

        .skills-label {
            width: 100%;
            color: var(--mut);
            font-size: .85rem
        }

        /* ===== YouTube facade: the video loads only when clicked ===== */
        .yt {
            position: relative;
            display: block;
            width: 100%;
            height: 100%;
            padding: 0;
            border: 0;
            background: #000;
            cursor: pointer
        }

            .yt img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                opacity: .85;
                transition: opacity .25s ease
            }

            .yt::after {
                content: "";
                position: absolute;
                left: 50%;
                top: 50%;
                width: 4.2rem;
                height: 3rem;
                transform: translate(-50%,-50%);
                background: var(--acc);
                box-shadow: 0 0 24px rgba(255,61,46,.5)
            }

            .yt::before {
                content: "";
                position: absolute;
                z-index: 1;
                left: 50%;
                top: 50%;
                transform: translate(-40%,-50%);
                border-style: solid;
                border-width: .7rem 0 .7rem 1.1rem;
                border-color: transparent transparent transparent #fff
            }

        @media (hover:hover) {
            .yt:hover img {
                opacity: 1
            }
        }

        /* ===== Case study dialog ===== */
        body:has(dialog[open]) {
            overflow: hidden
        }

        dialog {
            width: min(780px, calc(100% - 2rem));
            max-height: calc(100svh - 2rem);
            margin: auto;
            padding: 0;
            overflow: auto;
            background: #141417;
            color: var(--fg);
            border: 1px solid var(--glass-line);
            border-bottom: 3px solid var(--acc);
            border-radius: 0
        }

            dialog::backdrop {
                background: rgba(0,0,0,.65);
                -webkit-backdrop-filter: blur(4px);
                backdrop-filter: blur(4px)
            }

        .sheet {
            padding: 1.5rem 1.5rem 1.75rem;
            display: grid;
            gap: .6rem
        }

            .sheet h3 {
                font-size: 1.9rem;
                line-height: 1.1;
                font-weight: 800;
                letter-spacing: -.02em;
                padding-right: 6rem
            }

            .sheet h4 {
                margin-top: .9rem;
                color: var(--hot);
                font-size: .85rem;
                text-transform: uppercase;
                letter-spacing: .08em
            }

            .sheet .btn.close {
                position: absolute;
                top: 1rem;
                right: 1rem
            }

        pre {
            background: #0a0a0c;
            border: 1px solid var(--line);
            padding: 1rem;
            overflow: auto;
            font: .85rem/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            tab-size: 4
        }

        /* ===== Devlogs ===== */
        .devlogs {
            max-width: 1100px;
            margin: 0 auto;
            padding: 3rem 1.5rem 1rem
        }

        .logs {
            display: grid;
            gap: 1rem;
            margin-top: 1.25rem
        }

        .log {
            background: var(--glass);
            -webkit-backdrop-filter: var(--glass-fx);
            backdrop-filter: var(--glass-fx);
            border: 1px solid var(--glass-line);
            padding: 1.1rem 1.25rem
        }

            .log time {
                color: var(--mut);
                font-size: .9rem
            }

            .log h3 {
                font-size: 1.4rem;
                font-weight: 800;
                letter-spacing: -.02em;
                line-height: 1.15;
                margin: .2rem 0 .4rem
            }

            .log summary {
                cursor: pointer;
                color: var(--acc);
                margin-top: .6rem
            }

        .log-body p {
            margin-top: .7rem;
            max-width: 70ch
        }

        /* ===== Easter egg + toast ===== */
        .coffee {
            background: none;
            border: 0;
            font-size: 1.1rem;
            cursor: pointer;
            filter: grayscale(1);
            opacity: .55;
            transition: opacity .2s ease, filter .2s ease
        }

            .coffee:hover, .coffee.brew {
                filter: none;
                opacity: 1
            }

            .coffee.brew {
                animation: shake .45s
            }

        @keyframes shake {
            20% {
                transform: translateX(-3px) rotate(-8deg)
            }

            40% {
                transform: translateX(3px) rotate(8deg)
            }

            60% {
                transform: translateX(-2px) rotate(-5deg)
            }

            80% {
                transform: translateX(2px) rotate(5deg)
            }
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 1.5rem;
            z-index: 10;
            max-width: calc(100% - 2rem);
            transform: translate(-50%,1rem);
            opacity: 0;
            pointer-events: none;
            background: #1d1d21;
            border: 1px solid var(--glass-line);
            border-bottom: 3px solid var(--acc);
            padding: .6rem 1rem;
            transition: opacity .3s ease, transform .3s ease
        }

            .toast.on {
                opacity: 1;
                transform: translate(-50%,0)
            }

        @media (prefers-reduced-motion:reduce) {
            .coffee.brew {
                animation: none

        /* Wheel: the cards sit on a vertical drum. pos = (fractional) index in front of the viewer, goal = index it settles on */
        const when = $("when"), ticks = $("ticks");
        const STEP = 30, PITCH = 56;          // degrees between two cards / px between two timeline ticks
        let pos = 0, goal = 0, R = 0, rafW = 0;
        const behavior = instant => (instant || calm) ? "auto" : "smooth";
        const tickEls = [];   // filled by build()

        function update(i, instant) {
        active = i;
        tabs.forEach((t, j) => t.setAttribute("aria-current", j === i));
        const t = tabs[i];
        menu.scrollTo({ left: t.offsetLeft - (menu.clientWidth - t.offsetWidth) / 2, behavior: behavior(instant) });
        slides.forEach((s, j) => { if (j !== i) { s.querySelectorAll("video").forEach(v => v.pause()); if (s.stop) s.stop(); } });
        const dt = new Date(projects[i].date + "-01T12:00:00");
        if (projects[i].today) when.replaceChildren(el("span", "m", "Today"));
        else when.replaceChildren(el("span", "m", monthShort(dt)), el("span", "y", String(dt.getFullYear())));
        when.dateTime = projects[i].date;
        }

        function draw() {
        slides.forEach((s, i) => {
        const d = i - pos, a = Math.abs(d), vis = a < 1.7;
        s.style.visibility = vis ? "" : "hidden";
        if (!vis) return;
        if (s.load) { s.load(); s.load = null; }
        s.style.transform = `translateZ(${-R}px) rotateX(${-d * STEP}deg) translateZ(${R}px)`;
        s.style.opacity = Math.max(0, 1 - a * .75).toFixed(3);
        s.inert = a > .5;
        });
        tickEls.forEach((t, i) => {
        const d = i - pos;
        t.style.transform = `translateY(${d * PITCH}px)`;
        t.style.opacity = Math.max(0, 1 - Math.abs(d) * .22).toFixed(3);
        t.firstChild.style.opacity = Math.min(1, Math.max(0, (Math.abs(d) - .45) * 2.2)).toFixed(3);   // the centre date is shown big by .when
        });
        const n = Math.round(pos);
        if (n !== active && n >= 0 && n < slides.length) update(n);
        }

        function tick() {
        pos += (goal - pos) * (calm ? 1 : .16);
        if (Math.abs(goal - pos) < .002) pos = goal;
        draw();
        rafW = pos === goal ? 0 : requestAnimationFrame(tick);
        }

        /* Rotates the wheel to project i. Returns false when i does not exist (the caller can then hand over to the page) */
        function go(i, instant) {
        if (i < 0 || i > slides.length - 1) return false;
        goal = i;
        $("prev").disabled = i === 0;
        $("next").disabled = i === slides.length - 1;
        if (instant || calm) { pos = i; draw(); } else if (!rafW) rafW = requestAnimationFrame(tick);
        return true;
        }

        const measure = () => { if (!slides.length) return; R = slides[0].offsetHeight * 2; draw(); };   // drum radius: neighbours sit just outside the front card
        addEventListener("resize", measure); addEventListener("load", measure);
        if (document.fonts) document.fonts.ready.then(measure);

        $("prev").addEventListener("click", () => go(goal - 1));
        $("next").addEventListener("click", () => go(goal + 1));
        track.addEventListener("keydown", e => {
        const dir = e.key === "ArrowDown" ? 1 : e.key === "ArrowUp" ? -1 : 0;
        if (dir && go(goal + dir)) e.preventDefault();   // at either end the key falls through to the page
        });

        /* Drag / swipe (mouse and touch): the wheel follows the finger, then snaps. A swipe past either end moves to the next page section */
        let drag = null;
        track.addEventListener("pointerdown", e => {
        if (e.button || e.target.closest("video,iframe,a,button,.thumbs")) return;
        drag = { y: e.clientY, p: pos, i: goal, t: e.timeStamp, moved: false };
        });
        track.addEventListener("pointermove", e => {
        if (!drag) return;
        const dy = e.clientY - drag.y;
        if (!drag.moved) {
        if (Math.abs(dy) < 6) return;
        drag.moved = true; track.setPointerCapture(e.pointerId); track.classList.add("drag");
        cancelAnimationFrame(rafW); rafW = 0;
        }
        pos = Math.max(-.3, Math.min(slides.length - .7, drag.p - dy / (slides[0].offsetHeight * .8)));
        draw();
        });
        const endDrag = e => {
        if (!drag) return;
        const d = drag; drag = null; track.classList.remove("drag");
        if (!d.moved) return;
        const dy = e.clientY - d.y, fast = Math.abs(dy / Math.max(1, e.timeStamp - d.t)) > .5;
        const t = Math.max(0, Math.min(slides.length - 1, fast ? (dy < 0 ? Math.ceil(pos) : Math.floor(pos)) : Math.round(pos)));
        if (t === d.i && Math.abs(dy) > 40 && (dy < 0 ? t === slides.length - 1 : t === 0)) scrollBy({ top: (dy < 0 ? 1 : -1) * innerHeight * .8, behavior: calm ? "auto" : "smooth" });   // swipe past either end: hand over to the page
        go(t);
        };
        track.addEventListener("pointerup", endDrag);
        track.addEventListener("pointercancel", endDrag);

        /* Open on the newest project */
        renderFilters(); renderSkills(); build();

        /* Mouse wheel over the projects: turns the project wheel. At either end (or anywhere else on the page)
        the wheel is left alone, so the site keeps its normal native scrolling. */
        (() => {
        const stage = document.querySelector(".stage");
        let lastT = 0, lastD = 0, owned = 0;
        stage.addEventListener("wheel", e => {
        if (e.ctrlKey || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;   // pinch-zoom and horizontal gestures stay native
        const t = e.timeStamp, d = Math.abs(e.deltaY);
        const fresh = t - lastT > 90 || d > lastD * 1.8 + 2;                // a new gesture, or a clear new push during a trackpad's inertia tail
        lastT = t; lastD = d;
        if (fresh && d >= 2 && go(goal + (e.deltaY > 0 ? 1 : -1))) { owned = t; e.preventDefault(); return; }
        if (t - owned < 120) { owned = t; e.preventDefault(); }             // inertia tail of a gesture the project wheel took: do not leak it to the page
        }, { passive: false });
        })();

        /* Diamond pattern on the whole background. Only the diamonds near the mouse light up and emit light */
        (() => {
        const CELL = 16;              // half-diagonal of the lattice step: smaller = finer pattern
        const RADIUS = 230;           // vertical range of the light around the mouse (px)
        const STRETCH = 1.5;          // horizontal stretch of that area (1 = circle, 1.5 = 50% wider than tall)
        const RX = RADIUS * STRETCH;  // horizontal range of the light (px)
        const BASE = 0.26;            // diamond size at rest (1 = touching neighbours)
        const MAX = 0.9;              // diamond size right under the mouse: they grow smoothly from BASE to MAX
        const BASE_RIM = "rgba(255,255,255,.05)";   // resting outline (the diamonds are outlines only, no interior)
        const RIM = "240,160,115";    // luminous outline of lit diamonds
        const LIGHT = "205,88,26";    // light cast on the background by lit diamonds
        const LIGHT_DIV = 8;          // the light is drawn at 1/8 resolution, blurred, then upscaled
        const STEPS = 16;             // brightness levels while a diamond lights up (more = smoother fade)
        const MAX_FPS = 60;           // frame cap of the animation (0 = follow the screen refresh rate)
        const FRINGE = 110;           // px around the lit diamonds reached by their light: only this area is redrawn
        const fine = matchMedia("(hover: hover) and (pointer: fine)").matches;
        const baseCv = $("gridBase"), bctx = baseCv.getContext("2d");
        const cv = $("gridFx"), ctx = cv.getContext("2d");
        const lc = document.createElement("canvas"), lctx = lc.getContext("2d");
        const lb = document.createElement("canvas"), lbctx = lb.getContext("2d");   // blurred copy of lc

        /* Colour strings built once instead of every frame */
        const LIGHT_STYLE = Array.from({ length: 256 }, (_, q) => "rgba(" + LIGHT + "," + (.38 * (q / 255) * (q / 255)).toFixed(3) + ")");
        const RIM_STYLE = Array.from({ length: STEPS }, (_, b) => "rgba(" + RIM + "," + (.62 * (b + 1) / STEPS).toFixed(3) + ")");
        const GLOW_ALPHA = [.3, .55, .8];
        /* Falloff table: replaces a sqrt and a pow per diamond and per frame (t = squared elliptical distance / RADIUS²) */
        const LUT_N = 4096, INV_R2 = 1 / (RADIUS * RADIUS), KX = INV_R2 / (STRETCH * STRETCH);
        const FALLOFF = Float32Array.from({ length: LUT_N + 1 }, (_, i) => Math.pow(1 - Math.sqrt(i / LUT_N), 1.3));
        const BG = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim() || "#0d0d0f";
        const MASK_R = BASE * CELL + 3;   // covers the resting outline of a diamond while it is lit

        let W = 0, H = 0, dpr = 1, cols = 0, rows = 0;
        let lit = new Float32Array(0), pts = new Float32Array(0), act = new Uint32Array(0), nxt = new Uint32Array(0);
        let actN = 0, n = 0, nN = 0, prev = null;
        let lvR = new Uint8Array(0), ordR = new Uint32Array(0), rad = new Float32Array(0);
        const sR = new Int32Array(STEPS + 1), pR = new Int32Array(STEPS);
        const boxA = new Int32Array(4), boxB = new Int32Array(4);
        let flip = false;
        let mx = 0, my = 0, tx = 0, ty = 0, inside = false, running = false, last = 0;
        let grow = 1, shrink = 1, changed = false, minX = 0, maxX = 0, minY = 0, maxY = 0;

        const diamond = (path, x, y, r) => { path.moveTo(x, y - r); path.lineTo(x + r, y); path.lineTo(x, y + r); path.lineTo(x - r, y); path.closePath(); };
        const fit = (c, x) => { c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); x.setTransform(dpr, 0, 0, dpr, 0, 0); };

        /* Resting pattern: drawn once per size, outlines only, barely lighter than the background */
        function drawBase() {
        const body = new Path2D(), r = BASE * CELL, OFF = 4000;
        for (let j = 0; j < rows; j++) for (let i = j & 1; i < cols; i += 2) diamond(body, i * CELL, j * CELL, r);
        bctx.clearRect(0, 0, W, H);
        bctx.lineWidth = .75;
        bctx.save();
        bctx.translate(-OFF, 0);
        bctx.shadowColor = "rgba(0,0,0,.4)"; bctx.shadowBlur = 4 * dpr; bctx.shadowOffsetX = (OFF + 1) * dpr; bctx.shadowOffsetY = 2 * dpr;
        bctx.strokeStyle = "#000"; bctx.stroke(body);
        bctx.restore();
        bctx.strokeStyle = BASE_RIM; bctx.stroke(body);
        }

        function resize() {
        dpr = Math.min(devicePixelRatio || 1, 2);
        W = innerWidth; H = innerHeight;
        cols = Math.ceil(W / CELL) + 2; rows = Math.ceil(H / CELL) + 2;
        fit(baseCv, bctx); drawBase();
        if (!fine) return;
        fit(cv, ctx);
        ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
        lc.width = lb.width = Math.ceil(W / LIGHT_DIV); lc.height = lb.height = Math.ceil(H / LIGHT_DIV);
        lit = new Float32Array(cols * rows);
        pts = new Float32Array(cols * rows * 3);
        act = new Uint32Array(cols * rows); nxt = new Uint32Array(cols * rows);
        lvR = new Uint8Array(cols * rows); ordR = new Uint32Array(cols * rows); rad = new Float32Array(cols * rows);
        actN = 0; prev = null;
        }

        /* The animation only runs while something changes: it stops once the diamonds have settled */
        const start = () => { if (!running) { running = true; last = 0; requestAnimationFrame(frame); } };
        let rt;
        addEventListener("resize", () => {
        clearTimeout(rt);
        rt = setTimeout(() => { resize(); if (fine && inside) start(); }, 120);
        });
        resize();
        if (!fine) return;

        /* Updates one diamond's light level and records it if it is visible */
        function upd(k, cx, cy, target) {
        const o = lit[k];
        let l = o + (target - o) * (target > o ? grow : shrink);
        if (l < .01) l = 0;
        lit[k] = l;
        const dl = l - o;
        if (dl > 2e-4 || dl < -2e-4) changed = true;
        if (l > 0) {
        nxt[nN++] = k; pts[n++] = cx; pts[n++] = cy; pts[n++] = l;
        if (cx < minX) minX = cx; if (cx > maxX) maxX = cx; if (cy < minY) minY = cy; if (cy > maxY) maxY = cy;
        }
        }

        function frame(now) {
        if (MAX_FPS && last && now - last < 1000 / MAX_FPS - 4) { requestAnimationFrame(frame); return; }
        const dt = last ? Math.min((now - last) / 16.67, 4) : 1;
        last = now;
        const follow = calm ? 1 : 1 - Math.pow(1 - .4, dt);
        mx += (tx - mx) * follow; my += (ty - my) * follow;
        grow = calm ? 1 : 1 - Math.pow(1 - .35, dt); shrink = calm ? 1 : 1 - Math.pow(1 - .07, dt);
        changed = Math.abs(tx - mx) > .5 || Math.abs(ty - my) > .5;
        n = 0; nN = 0; minX = minY = Infinity; maxX = maxY = -Infinity;

        /* 1. light level of the diamonds: only those near the mouse and those still fading are visited */
        let i0 = 0, i1 = -1, j0 = 0, j1 = -1;
        if (inside) {
        i0 = Math.max(0, Math.floor((mx - RX) / CELL)); i1 = Math.min(cols - 1, Math.ceil((mx + RX) / CELL));
        j0 = Math.max(0, Math.floor((my - RADIUS) / CELL)); j1 = Math.min(rows - 1, Math.ceil((my + RADIUS) / CELL));
        for (let j = j0; j <= j1; j++) {
        const cy = j * CELL, dy = cy - my, dyT = dy * dy * INV_R2;
        for (let i = i0 + ((i0 ^ j) & 1); i <= i1; i += 2) {
        const cx = i * CELL, dx = cx - mx, t = dx * dx * KX + dyT, k = j * cols + i;
        const target = t < 1 ? FALLOFF[(t * LUT_N + .5) | 0] : 0;
        if (target === 0 && lit[k] === 0) continue;   // nothing to light, nothing to fade
        upd(k, cx, cy, target);
        }
        }
        }
        for (let a = 0; a < actN; a++) {
        const k = act[a], j = (k / cols) | 0, i = k - j * cols;
        if (inside && i >= i0 && i <= i1 && j >= j0 && j <= j1) continue;
        upd(k, i * CELL, j * CELL, 0);
        }
        const swap = act; act = nxt; nxt = swap; actN = nN;

        /* Area to redraw (in light-canvas pixels): where diamonds are now, plus where they were */
        const M = FRINGE;
        let cur = null;
        if (n) {
        cur = flip ? boxB : boxA; flip = !flip;
        cur[0] = Math.max(0, Math.floor((minX - M) / LIGHT_DIV)); cur[1] = Math.max(0, Math.floor((minY - M) / LIGHT_DIV));
        cur[2] = Math.min(lc.width, Math.ceil((maxX + M) / LIGHT_DIV)); cur[3] = Math.min(lc.height, Math.ceil((maxY + M) / LIGHT_DIV));
        }
        const ub = cur || prev;
        if (ub) {
        const ux0 = cur && prev ? Math.min(cur[0], prev[0]) : ub[0], uy0 = cur && prev ? Math.min(cur[1], prev[1]) : ub[1];
        const ux1 = cur && prev ? Math.max(cur[2], prev[2]) : ub[2], uy1 = cur && prev ? Math.max(cur[3], prev[3]) : ub[3];
        lctx.clearRect(ux0, uy0, ux1 - ux0, uy1 - uy0);
        lbctx.clearRect(ux0, uy0, ux1 - ux0, uy1 - uy0);
        ctx.clearRect(ux0 * LIGHT_DIV, uy0 * LIGHT_DIV, (ux1 - ux0) * LIGHT_DIV, (uy1 - uy0) * LIGHT_DIV);
        }
        prev = cur;

        if (n) {
        const cnt = n / 3;

        /* 2. group the lit diamonds by brightness level (counting sort: no allocation) */
        sR.fill(0);
        for (let k = 0, p = 2; k < cnt; k++, p += 3) {
        const l = pts[p], b = Math.min(STEPS - 1, (Math.min(1, l * 1.4) * STEPS) | 0);
        lvR[k] = b; sR[b + 1]++;
        rad[k] = (BASE + (MAX - BASE) * l) * CELL;
        }
        for (let b = 0; b < STEPS; b++) sR[b + 1] += sR[b];
        pR.set(sR.subarray(0, STEPS));
        for (let k = 0; k < cnt; k++) ordR[pR[lvR[k]]++] = k;

        /* 3. a lit diamond is the resting one growing: hide the resting outline underneath */
        ctx.fillStyle = BG; ctx.beginPath();
        for (let k = 0, p = 0; k < cnt; k++, p += 3) diamond(ctx, pts[p], pts[p + 1], MASK_R);
        ctx.fill();

        /* 4. light cast on the background: diamonds drawn sharp at low resolution, then copied once with a single blur */
        const LK = CELL * 1.5 / LIGHT_DIV;
        for (let k = 0, p = 0; k < cnt; k++, p += 3) {
        const l = pts[p + 2];
        if (l < .05) continue;
        lctx.fillStyle = LIGHT_STYLE[(l * 255 + .5) | 0];
        lctx.beginPath(); diamond(lctx, pts[p] / LIGHT_DIV, pts[p + 1] / LIGHT_DIV, (BASE + (MAX - BASE) * l) * LK);
        lctx.fill();
        }
        const cw = cur[2] - cur[0], ch = cur[3] - cur[1];
        lbctx.shadowColor = "rgba(" + LIGHT + ",.9)"; lbctx.shadowBlur = 5;
        lbctx.drawImage(lc, cur[0], cur[1], cw, ch, cur[0], cur[1], cw, ch);
        ctx.drawImage(lb, cur[0], cur[1], cw, ch, cur[0] * LIGHT_DIV, cur[1] * LIGHT_DIV, cw * LIGHT_DIV, ch * LIGHT_DIV);

        /* 5. very light drop shadow of the outlines (drawn off-screen so only the shadow shows) */
        ctx.lineWidth = 1.25; ctx.lineJoin = "miter";
        const OFF = 4000;
        ctx.save();
        ctx.translate(-OFF, 0);
        ctx.shadowColor = "rgba(0,0,0,.3)"; ctx.shadowBlur = 5 * dpr; ctx.shadowOffsetX = (OFF + 1) * dpr; ctx.shadowOffsetY = 2.5 * dpr;
        ctx.strokeStyle = "#000"; ctx.beginPath();
        for (let k = 0, p = 0; k < cnt; k++, p += 3) diamond(ctx, pts[p], pts[p + 1], rad[k]);
        ctx.stroke();
        ctx.restore();

        /* 6. luminous outlines only (no interior), brighter levels last */
        for (let b = 0; b < STEPS; b++) {
        const s0 = sR[b], s1 = sR[b + 1];
        if (s0 === s1) continue;
        ctx.beginPath();
        for (let a = s0; a < s1; a++) { const k = ordR[a], p = k * 3; diamond(ctx, pts[p], pts[p + 1], rad[k]); }
        ctx.strokeStyle = RIM_STYLE[b]; ctx.stroke();
        }
        ctx.save();
        ctx.strokeStyle = "rgba(" + RIM + ",.8)"; ctx.shadowColor = "rgba(215,115,65,.6)"; ctx.shadowBlur = 4 * dpr;
        for (let g = 0; g < 3; g++) {
        ctx.beginPath(); let any = false;
        for (let k = 0, p = 2; k < cnt; k++, p += 3) {
        const l = pts[p];
        if (l <= .25 || (l > .75 ? 2 : l > .5 ? 1 : 0) !== g) continue;
        diamond(ctx, pts[p - 2], pts[p - 1], rad[k]); any = true;
        }
        if (any) { ctx.globalAlpha = GLOW_ALPHA[g]; ctx.stroke(); }
        }
        ctx.restore();
        }

        if (changed || (!inside && n)) requestAnimationFrame(frame);
        else { running = false; last = 0; }
        }

        addEventListener("pointermove", e => {
        if (e.pointerType !== "mouse") return;
        tx = e.clientX; ty = e.clientY;
        if (!inside) { inside = true; if (!running) { mx = tx; my = ty; } }
        start();
        });
        document.documentElement.addEventListener("pointerleave", () => { inside = false; if (prev) start(); });
        })();
    </script>
</body>
</html>
