<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0d0f;
            --surf: #18181b;
            --fg: #ececec;
            --mut: #8e8e96;
            --acc: #ff3d2e;
            --hot: #ff9a1f;
            --line: #2c2c31;
            --spot-core-rgb: 255,205,190;
            --spot-mid-rgb: 255,75,52;
            --spot-rgb: 255,61,46;
            --spot-core-size: 70px;
            --spot-mid-size: 140px;
            --spot-size: 220px;
            --glass: rgba(24,24,27,.48);
            --glass-line: rgba(255,255,255,.09);
            color-scheme: dark
        }



        * {
            box-sizing: border-box;
            margin: 0
        }

        body {
            background: var(--bg);
            color: var(--fg);
            font: 400 1.0625rem/1.6 "Bricolage Grotesque",system-ui,sans-serif;
            -webkit-font-smoothing: antialiased
        }

        a {
            color: var(--acc)
        }

        :focus-visible {
            outline: 3px solid var(--acc);
            outline-offset: 3px
        }

        header {
            max-width: 1100px;
            margin: 0 auto;
            padding: clamp(2rem,6vw,5rem) 1.5rem 2.5rem;
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 2.5rem;
            align-items: end
        }

        h1 {
            font-size: clamp(2.8rem,8vw,5.5rem);
            line-height: .95;
            font-weight: 800;
            letter-spacing: -.035em
        }

        .title {
            color: var(--mut);
            margin-top: 1rem;
            font-size: 1.25rem
        }

        .links {
            display: flex;
            gap: 1.25rem;
            flex-wrap: wrap;
            margin-top: 1.5rem;
            padding: 0;
            list-style: none
        }

        .bio {
            display: grid;
            gap: 1rem;
            max-width: 60ch
        }

        .photo {
            justify-self: start;
            width: 9rem;
            aspect-ratio: 4/5;
            object-fit: cover;
            border-radius: 0;
            margin-bottom: .5rem;
            background: var(--surf)
        }

        .projects-head {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem
        }

        h2.section {
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -.02em
        }

        .arrows {
            display: flex;
            gap: .5rem
        }

            .arrows button {
                width: 2.75rem;
                height: 2.75rem;
                border-radius: 0;
                border: 1px solid var(--line);
                background: var(--surf);
                color: var(--fg);
                font-size: 1.25rem;
                cursor: pointer
            }

                .arrows button:disabled {
                    opacity: .35;
                    cursor: default
                }

        .menu {
            position: relative;
            max-width: 1100px;
            margin: .75rem auto 0;
            padding: 0 1.5rem;
            display: flex;
            gap: .25rem;
            overflow-x: auto;
            scrollbar-width: none
        }

            .menu button {
                background: none;
                border: 0;
                border-bottom: 3px solid transparent;
                color: var(--mut);
                font: inherit;
                padding: .7rem .9rem;
                cursor: pointer;
                white-space: nowrap
            }

                .menu button[aria-current=true] {
                    color: var(--fg);
                    font-weight: 700;
                    border-color: var(--acc)
                }

        .track {
            position: relative;
            display: flex;
            gap: 1.5rem;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
            padding: 1.75rem max(1.5rem,calc(50vw - 550px));
            scroll-padding-inline: max(1.5rem,calc(50vw - 550px));
            cursor: grab
        }

            .track::-webkit-scrollbar, .menu::-webkit-scrollbar {
                display: none
            }

            .track.drag {
                scroll-snap-type: none;
                cursor: grabbing;
                user-select: none
            }

        .slide {
            flex: 0 0 min(1000px,88vw);
            scroll-snap-align: start;
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 2rem;
            background: var(--glass);
            -webkit-backdrop-filter: blur(16px) saturate(130%);
            backdrop-filter: blur(16px) saturate(130%);
            border: 1px solid var(--glass-line);
            border-radius: 0;
            padding: 1.25rem
        }

        .media {
            aspect-ratio: 16/9;
            border-radius: 0;
            overflow: hidden;
            background: #000;
            display: grid;
            place-items: center
        }

            .media video, .media iframe {
                width: 100%;
                height: 100%;
                border: 0
            }

            .media img {
                width: 100%;
                height: 100%;
                object-fit: contain
            }

        .gallery {
            display: grid;
            gap: .6rem;
            align-content: start
        }

        .thumbs {
            display: flex;
            gap: .5rem;
            overflow-x: auto;
            scrollbar-width: none
        }

            .thumbs button {
                flex: 0 0 auto;
                width: 4.75rem;
                aspect-ratio: 16/9;
                padding: 0;
                border: 2px solid transparent;
                border-radius: 0;
                overflow: hidden;
                background: var(--bg);
                color: var(--fg);
                font: inherit;
                font-size: .85rem;
                cursor: pointer;
                opacity: .7
            }

                .thumbs button[aria-current=true] {
                    border-color: var(--acc);
                    opacity: 1
                }

            .thumbs img {
                display: block;
                width: 100%;
                height: 100%;
                object-fit: cover
            }

        .novid {
            color: var(--mut);
            padding: 1rem;
            text-align: center
        }

        .txt {
            display: flex;
            flex-direction: column;
            gap: .9rem;
            padding: .5rem .5rem .5rem 0
        }

        .date {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: .35rem .6rem;
            color: var(--mut);
            font-size: .95rem
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            padding-left: .6rem;
            border-left: 1px solid var(--line)
        }

            .status::before {
                content: "";
                width: .45rem;
                height: .45rem;
                border-radius: 50%;
                background: var(--mut);
                opacity: .6
            }

            .status[data-state=ongoing]::before {
                background: var(--hot);
                opacity: 1
            }

        .txt h3 {
            font-size: clamp(1.7rem,3.2vw,2.3rem);
            line-height: 1.05;
            font-weight: 800;
            letter-spacing: -.025em
        }

        dl {
            margin-top: auto;
            border-top: 1px solid var(--line);
            padding-top: .9rem
        }

        dt {
            color: var(--mut);
            font-size: .95rem
        }

        dd {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--hot)
        }

        footer {
            max-width: 1100px;
            margin: 0 auto;
            padding: 1rem 1.5rem 3rem;
            color: var(--mut);
            font-size: .95rem
        }

        @media (max-width:760px) {
            header {
                grid-template-columns: 1fr;
                gap: 1.5rem
            }

            .slide {
                grid-template-columns: 1fr;
                gap: 1rem
            }

            .txt {
                padding: 0 .25rem .25rem
            }
        }





        html {
            scroll-behavior: smooth;
            scroll-snap-type: y proximity
        }

        @media (prefers-reduced-motion:reduce) {
            html {
                scroll-behavior: auto
            }
        }

        .page {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            scroll-snap-align: start
        }

        .about header {
            width: 100%;
            margin: auto;
            align-items: center
        }

        .cue {
            align-self: center;
            padding: 1.5rem;
            color: var(--mut);
            text-decoration: none
        }

            .cue:hover {
                color: var(--fg)
            }

        #projects .body {
            margin-block: auto;
            padding-block: 2rem
        }

        footer {
            display: flex;
            justify-content: space-between;
            width: 100%
        }

        .spot {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: 0;
            transition: opacity .4s;
            /* Lumière en volume, derrière tout le contenu (z-index 0 < .page à 1) : elle n'éclaire que le fond.
               3 couches empilées (la première listée est au-dessus), chacune avec un fondu gaussien
               (alpha ≈ A·e^(-4r²)) : cœur blanc-chaud très intense, halo orange, brume rouge.
               Les couches suivent la souris à des vitesses différentes (--m*, --n*, --h*) pour la profondeur. */
            background: radial-gradient(circle var(--spot-core-size) at var(--mx,50%) var(--my,50%), rgba(var(--spot-core-rgb),.950) 0%, rgba(var(--spot-core-rgb),.810) 20%, rgba(var(--spot-core-rgb),.500) 40%, rgba(var(--spot-core-rgb),.225) 60%, rgba(var(--spot-core-rgb),.073) 80%, rgba(var(--spot-core-rgb),0) 100%), radial-gradient(circle var(--spot-mid-size) at var(--nx,50%) var(--ny,50%), rgba(var(--spot-mid-rgb),.600) 0%, rgba(var(--spot-mid-rgb),.511) 20%, rgba(var(--spot-mid-rgb),.316) 40%, rgba(var(--spot-mid-rgb),.142) 60%, rgba(var(--spot-mid-rgb),.046) 80%, rgba(var(--spot-mid-rgb),0) 100%), radial-gradient(circle var(--spot-size) at var(--hx,50%) var(--hy,50%), rgba(var(--spot-rgb),.240) 0%, rgba(var(--spot-rgb),.204) 20%, rgba(var(--spot-rgb),.126) 40%, rgba(var(--spot-rgb),.057) 60%, rgba(var(--spot-rgb),.018) 80%, rgba(var(--spot-rgb),0) 100%)
        }

            .spot.on {
                opacity: 1
            }

        @media (hover:none) {
            .spot {
                display: none
            }
        }
    </style>
</head>
<body>

    <section class="page about" id="about">
        <header>
            <div>
                <h1 id="name"></h1>
                <p class="title" id="title"></p>
                <ul class="links" id="links"></ul>
            </div>
            <div class="bio" id="bio"></div>
        </header>
        <a class="cue" href="#projects">Projects ↓</a>
    </section>

    <main class="page" id="projects">
        <div class="body">
            <div class="projects-head">
                <h2 class="section">Projects</h2>
                <div class="arrows">
                    <button id="prev" aria-label="Older project">‹</button>
                    <button id="next" aria-label="Newer project">›</button>
                </div>
            </div>
            <nav class="menu" id="menu" aria-label="Project list"></nav>
            <div class="track" id="track" tabindex="0" aria-label="Projects, oldest on the left, newest on the right"></div>
        </div>
        <footer><span id="copy"></span><a href="#about">↑ About</a></footer>
    </main>

    <div class="spot" id="spot" aria-hidden="true"></div>

    <script>
        /* ====== EDIT THIS: your information ====== */
        const PROFILE = {
        name: "Ludwig Gurget",
        title: "Student gameplay programmer C++ / C#",
        // Portrait shown next to your bio. Put the image in the repo next to index.html
        // (default file name: photo.jpg). If the file is missing, no photo is shown.
        photo: "photo.jpg",
        bio: [
        "I design and program gameplay systems, editor tools and interactive experiences in Unity and Unreal Engine 5.",
        "I like small, well-finished systems: an animation that reacts to the player, a tool that saves the team an hour, a prototype that holds together.",
        "Replace this text with your background, education and favourite tools."
        ],
        links: [
        { label: "GitHub", url: "https://github.com/HiItsFeu" },
        { label: "LinkedIn", url: "https://www.linkedin.com/in/ludwig-gurget-769787261" },
        { label: "Contact", url: "mailto:l.gurget@gmail.com" }
        ]
        };

        /* One object per project.
        order    : display position. 1 = shown first (the page opens on it, on the right), 2 = the next one
        you reach by scrolling right, and so on. Projects without "order" come last, newest first.
        date     : "YYYY-MM" (shown on the slide, also used to break ties between equal orders)
        duration : free text, e.g. "3 weeks"
        ongoing  : true if the project is still in production (shows "In progress" next to the date).
        Leave it out (or false) for a finished project (shows "Completed").
        video    : a YouTube link (youtube.com or youtu.be) OR a file in the repo, e.g. "videos/demo.mp4".
        Leave "" if there is none.
        videos   : (optional) several videos, same format as "video",
        e.g. ["https://youtu.be/AAAAAAAAAAA", "videos/demo.mp4"].
        You can use "video", "videos" or both (the single "video" comes first).
        photos   : list of images in the repo, e.g. ["images/shot1.jpg", "images/shot2.jpg"].
        They appear with the videos in a small gallery (videos first). Leave [] if there are none.
        link     : (optional) repository or project page */
        const PROJECTS = [
        { name: "CPU Engine", order: 1, date: "2026-10", duration: "4 weeks", ongoing: true,
        bio: "A custom Engine running on CPU, rasterizer in C++ with SDL3 : window, framebuffer and scanline triangle filling, no GPU.",
        video: "", photos: ["Pictures/PGPEngine1.png"], link: "" },
        { name: "A simple slime", order: 2, date: "2026-10", duration: "3 weeks",
        bio: "A game prototype focused on gamefeels and gameplay. Made fully in Unity with a handmade character controller.",
        video: "https://www.youtube.com/watch?v=g6VkB29s6fE", photos: [], link: "" },
        { name: "Fps prototype", order: 3, date: "2026-08", duration: "1 month",
        bio: "A tiny fps prototype built on Unreal 4. The goal was to stress test my abilities to create something under a strict timeline.",
        video: "https://www.youtube.com/watch?v=nlRbgm4-v0M", photos: [], link: "" },
        { name: "Guadeloupe: The Secret of the Three Rivers", order: 4, date: "2026-07", duration: "1 month",
        bio: "Professional project, handled by BlackFrogStudio. This game is about Guadeloupe and its lore, the player trip across the island and try to solve its mysteries.",
        video: "https://www.youtube.com/watch?v=zlhlM9s28EE", photos: [], link: "" },
        { name: "Spline Tools (UE5)", order: 5, date: "2026-07", duration: "2 weeks",
        bio: "Blueprint and C++ editor tools for Unreal Engine 5: snapping splines to terrain, moving along curves, high customization of parameters.",
        video: "https://www.youtube.com/watch?v=yAbLEiAEBwk", photos: [], link: "" },
        { name: "Dialogue and Cutscene System", order: 6, date: "2026-06", duration: "1 week",
        bio: "A dialogue and cutscene LevelSequence system for Guadeloupe built on Unreal Engine.",
        video: "https://www.youtube.com/watch?v=2vAAXGh2Jo8", photos: [], link: "" },
        { name: "Turbo Drift 2", order: 7, date: "2026-05", duration: "Undefined", ongoing: true,
        bio: "A car game, based on a student project Turbo Drift. My biggest game project, build on UE 5.7, all handmade (expect the game engine xD). By doing that, i want to deeply learn UE but also blender, 3D pipeline and offcourse gpp.",
        video: "", photos: ["Pictures/Test4.png" , "Pictures/SideView.png" , "Pictures/OrthoView.png" , "Pictures/TopView.png"], link: "" },
        { name: "Turbo Drift", order: 8, date: "2026-05", duration: "1 month",
        bio: "A car game prototype made on home made game engine, fully c++ and vulkan. Handmade car sounds and sfx, assets are made by the art team.",
        videos: ["https://www.youtube.com/watch?v=UNN34BJ2Xj8", "https://www.youtube.com/watch?v=o79piqJLBgM"], photos: [], link: "" },
        { name: "LayBug", order: 9, date: "2026-05", duration: "2 days",
        bio: "A game jam game, won favorite jury's game.",
        video: "https://www.youtube.com/watch?v=B9UFAe060Mc", photos: [], link: "" }
        ];
        /* ====== End of the editable area ====== */

        const $ = id => document.getElementById(id);
        const el = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };
        const monthFmt = new Intl.DateTimeFormat("en", { month: "long", year: "numeric" });
        const ytId = u => (u.match(/(?:youtu\.be\/|[?&]v=|embed\/)([\w-]{11})/) || [])[1];
        const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;

        /* Profile */
        document.title = PROFILE.name + " – Portfolio";
        $("name").textContent = PROFILE.name;
        $("title").textContent = PROFILE.title;
        if (PROFILE.photo) {
        const img = el("img", "photo");
        img.src = PROFILE.photo; img.alt = "Portrait of " + PROFILE.name;
        img.onerror = () => img.remove();
        $("bio").append(img);
        }
        PROFILE.bio.forEach(p => $("bio").append(el("p", "", p)));
        PROFILE.links.forEach(l => {
        const li = el("li"), a = el("a", "", l.label);
        a.href = l.url;
        if (!l.url.startsWith("mailto:")) { a.target = "_blank"; a.rel = "noopener"; }
        li.append(a); $("links").append(li);
        });
        $("copy").textContent = "© " + new Date().getFullYear() + " " + PROFILE.name;

        /* Projects: order 1 on the right, following orders to its left */
        const projects = [...PROJECTS]
        .sort((a, b) => ((a.order ?? Infinity) - (b.order ?? Infinity)) || b.date.localeCompare(a.date))
        .reverse(); // order 1 ends up on the far right
        const track = $("track"), menu = $("menu");
        const slides = [], tabs = [];
        let active = projects.length - 1;

        projects.forEach((p, i) => {
        const s = el("article", "slide");
        const items = [];
        const vids = [p.video, ...(p.videos || [])].filter(Boolean);
        vids.forEach((v, n) => items.push({ video: v, label: vids.length > 1 ? "Video " + (n + 1) : "Video" }));
        (p.photos || []).forEach((src, n) => items.push({ src, alt: p.name + " – photo " + (n + 1) }));
        const gallery = el("div", "gallery"), media = el("div", "media"), thumbs = el("div", "thumbs"), thumbBtns = [];
        gallery.append(media);
        const show = k => {
        const it = items[k], yt = it.video && ytId(it.video);
        let node;
        if (yt) {
        node = el("iframe");
        node.src = "https://www.youtube-nocookie.com/embed/" + yt;
        node.title = "Demo: " + p.name + (vids.length > 1 ? " – " + it.label : ""); node.loading = "lazy"; node.allowFullscreen = true;
        node.allow = "accelerometer; encrypted-media; picture-in-picture; fullscreen";
        } else if (it.video) {
        node = el("video"); node.src = it.video; node.controls = true; node.preload = "metadata"; node.playsInline = true;
        } else {
        node = el("img"); node.src = it.src; node.alt = it.alt;
        }
        media.replaceChildren(node);
        thumbBtns.forEach((b, j) => b.setAttribute("aria-current", j === k));
        };
        if (!items.length) {
        media.append(el("p", "novid", "Demo video coming soon"));
        } else {
        if (items.length > 1) {
        items.forEach((it, k) => {
        const b = el("button");
        if (it.video) b.textContent = "▶ " + it.label;
        else { const im = el("img"); im.src = it.src; im.alt = ""; im.loading = "lazy"; b.append(im); }
        b.setAttribute("aria-label", it.video ? "Demo " + it.label.toLowerCase() : it.alt);
        b.addEventListener("click", () => show(k));
        thumbs.append(b); thumbBtns.push(b);
        });
        gallery.append(thumbs);
        }
        show(0);
        }
        const txt = el("div", "txt");
        const meta = el("p", "date", monthFmt.format(new Date(p.date + "-01T12:00:00")));
        const status = el("span", "status", p.ongoing ? "In progress" : "Completed");
        status.dataset.state = p.ongoing ? "ongoing" : "done";
        meta.append(status);
        txt.append(meta, el("h3", "", p.name), el("p", "", p.bio));
        const dl = el("dl");
        dl.append(el("dt", "", "Production time"), el("dd", "", p.duration));
        txt.append(dl);
        if (p.link) { const a = el("a", "", "View project"); a.href = p.link; a.target = "_blank"; a.rel = "noopener"; txt.append(a); }
        s.append(gallery, txt); track.append(s); slides.push(s);

        const t = el("button", "", p.name);
        t.addEventListener("click", () => go(i));
        menu.append(t); tabs.push(t);
        });

        const padLeft = () => parseFloat(getComputedStyle(track).paddingLeft);
        const behavior = instant => (instant || calm) ? "auto" : "smooth";
        function go(i, instant) {
        i = Math.max(0, Math.min(slides.length - 1, i));
        track.scrollTo({ left: slides[i].offsetLeft - padLeft(), behavior: behavior(instant) });
        }
        function update(i, instant) {
        active = i;
        tabs.forEach((t, j) => t.setAttribute("aria-current", j === i));
        const t = tabs[i];
        menu.scrollTo({ left: t.offsetLeft - (menu.clientWidth - t.offsetWidth) / 2, behavior: behavior(instant) });
        $("prev").disabled = i === 0;
        $("next").disabled = i === slides.length - 1;
        slides.forEach((s, j) => { if (j !== i) s.querySelectorAll("video").forEach(v => v.pause()); });
        }
        let raf;
        track.addEventListener("scroll", () => {
        cancelAnimationFrame(raf);
        raf = requestAnimationFrame(() => {
        const x = track.scrollLeft, g = padLeft();
        let i = slides.reduce((m, s, j) => Math.abs(s.offsetLeft - g - x) < Math.abs(slides[m].offsetLeft - g - x) ? j : m, 0);
        if (x >= track.scrollWidth - track.clientWidth - 2) i = slides.length - 1;
        if (i !== active) update(i);
        });
        });
        $("prev").addEventListener("click", () => go(active - 1));
        $("next").addEventListener("click", () => go(active + 1));
        track.addEventListener("keydown", e => {
        if (e.key === "ArrowLeft") { e.preventDefault(); go(active - 1); }
        if (e.key === "ArrowRight") { e.preventDefault(); go(active + 1); }
        });

        /* Mouse drag (touch scrolling is native) */
        let drag = null;
        track.addEventListener("pointerdown", e => {
        if (e.pointerType !== "mouse" || e.target.closest("video,iframe,a,button")) return;
        drag = { x: e.clientX, s: track.scrollLeft };
        track.classList.add("drag"); track.setPointerCapture(e.pointerId);
        });
        track.addEventListener("pointermove", e => { if (drag) track.scrollLeft = drag.s - (e.clientX - drag.x); });
        const endDrag = () => { if (!drag) return; drag = null; track.classList.remove("drag"); go(active); };
        track.addEventListener("pointerup", endDrag);
        track.addEventListener("pointercancel", endDrag);

        /* Open on the newest project */
        update(active, true);
        go(active, true);

        /* Light that follows the mouse (fine pointers only) */
        if (matchMedia("(hover: hover) and (pointer: fine)").matches) {
        const spot = $("spot");
        let tx = 0, ty = 0, running = false;
        /* 3 couches de lumière : cœur (rapide), halo (moyen), brume (lent) */
        const layers = [["--mx", "--my", .2], ["--nx", "--ny", .11], ["--hx", "--hy", .06]]
        .map(([x, y, k]) => ({ x, y, k, cx: 0, cy: 0 }));
        const tick = () => {
        let moving = false;
        layers.forEach(l => {
        l.cx += (tx - l.cx) * (calm ? 1 : l.k); l.cy += (ty - l.cy) * (calm ? 1 : l.k);
        spot.style.setProperty(l.x, l.cx + "px"); spot.style.setProperty(l.y, l.cy + "px");
        if (Math.abs(tx - l.cx) > .5 || Math.abs(ty - l.cy) > .5) moving = true;
        });
        if (moving) requestAnimationFrame(tick); else running = false;
        };
        addEventListener("pointermove", e => {
        if (e.pointerType !== "mouse") return;
        tx = e.clientX; ty = e.clientY;
        if (!spot.classList.contains("on")) { layers.forEach(l => { l.cx = tx; l.cy = ty; }); spot.classList.add("on"); }
        if (!running) { running = true; requestAnimationFrame(tick); }
        });
        document.documentElement.addEventListener("pointerleave", () => spot.classList.remove("on"));
        }
    </script>
</body>
</html>
