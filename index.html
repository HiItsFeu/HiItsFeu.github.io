<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0d0f;
            --surf: #18181b;
            --fg: #ececec;
            --mut: #8e8e96;
            --acc: #ff3d2e;
            --hot: #ff9a1f;
            --line: #2c2c31;
            --glass: rgba(24,24,27,.42);
            --glass-fx: blur(5px) saturate(125%); /* one shared frosted-glass look: squares stay visible but soft */
            --glass-line: rgba(255,255,255,.09);
            color-scheme: dark
        }



        * {
            box-sizing: border-box;
            margin: 0
        }

        body {
            background: var(--bg);
            color: var(--fg);
            font: 400 1.0625rem/1.6 "Bricolage Grotesque",system-ui,sans-serif;
            -webkit-font-smoothing: antialiased
        }

        a {
            color: var(--acc)
        }

        :focus-visible {
            outline: 3px solid var(--acc);
            outline-offset: 3px
        }

        header {
            max-width: 1100px;
            margin: 0 auto;
            padding: clamp(2rem,6vw,5rem) 1.5rem 2.5rem;
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 2.5rem;
            align-items: end
        }

        h1 {
            font-size: clamp(2.8rem,8vw,5.5rem);
            line-height: .95;
            font-weight: 800;
            letter-spacing: -.035em
        }

        .title {
            color: var(--mut);
            margin-top: 1rem;
            font-size: 1.25rem
        }

        .links {
            display: flex;
            gap: 1.25rem;
            flex-wrap: wrap;
            margin-top: 1.5rem;
            padding: 0;
            list-style: none
        }

        .bio {
            display: grid;
            gap: 1rem;
            max-width: 60ch
        }

        .photo {
            justify-self: start;
            width: 9rem;
            aspect-ratio: 4/5;
            object-fit: cover;
            border-radius: 0;
            margin-bottom: .5rem;
            background: var(--surf)
        }

        .projects-head {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem
        }

        h2.section {
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -.02em
        }

        .arrows {
            display: flex;
            flex-direction: column;
            gap: .5rem;
            flex: none
        }

            .arrows button {
                width: 2.75rem;
                height: 2.75rem;
                background: var(--glass);
                -webkit-backdrop-filter: var(--glass-fx);
                backdrop-filter: var(--glass-fx);
                border: 1px solid var(--glass-line);
                border-bottom: 3px solid #4a4a52;
                border-radius: 0;
                color: var(--fg);
                font-size: 1.25rem;
                cursor: pointer;
                transition: transform .25s cubic-bezier(.2,.8,.2,1), background-color .25s ease, border-color .25s ease, opacity .25s ease
            }

        @media (hover:hover) {
            .arrows button:hover:not(:disabled) {
                background-color: rgba(78,78,86,.5);
                border-color: var(--acc);
                transform: scale(1.06)
            }
        }

        .arrows button:disabled {
            opacity: .35;
            cursor: default
        }

        @media (prefers-reduced-motion:reduce) {
            .arrows button {
                transition: none
            }
        }

        .menu {
            position: relative;
            max-width: 1100px;
            margin: .15rem auto -.6rem;
            padding: .6rem 1.5rem;
            display: flex;
            gap: .5rem;
            overflow-x: auto;
            scrollbar-width: none
        }

            .menu button {
                background: var(--glass);
                -webkit-backdrop-filter: var(--glass-fx);
                backdrop-filter: var(--glass-fx);
                border: 1px solid var(--glass-line);
                border-radius: 0;
                border-bottom: 3px solid #4a4a52;
                color: var(--mut);
                font: inherit;
                padding: .7rem .9rem;
                cursor: pointer;
                white-space: nowrap;
                transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s ease, background-color .25s ease, color .25s ease, border-color .25s ease
            }

        @media (hover:hover) {
            .menu button:hover {
                background-color: rgba(78,78,86,.5);
                transform: scale(1.03)
            }
        }

        .menu button[aria-current=true] {
            color: var(--fg);
            font-weight: 700;
            border-color: rgba(255,106,43,.55);
            border-bottom-color: var(--acc);
            transform: scale(1.04);
            z-index: 1
        }

        @media (hover:hover) {
            .menu button:hover {
                border-color: var(--acc)
            }
        }

        @media (prefers-reduced-motion:reduce) {
            .menu button {
                transition: none
            }
        }

        .menu::-webkit-scrollbar {
            display: none
        }

        .slide {
            grid-area: 1 / 1;
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 2rem;
            background: var(--glass);
            -webkit-backdrop-filter: var(--glass-fx);
            backdrop-filter: var(--glass-fx);
            border: 1px solid var(--glass-line);
            border-radius: 0;
            padding: 1.25rem
        }

        .media {
            aspect-ratio: 16/9;
            border-radius: 0;
            overflow: hidden;
            background: #000;
            display: grid;
            place-items: center
        }

            .media video, .media iframe {
                width: 100%;
                height: 100%;
                border: 0
            }

            .media img {
                width: 100%;
                height: 100%;
                object-fit: contain
            }

        .gallery {
            display: grid;
            gap: .6rem;
            align-content: start
        }

        .thumbs {
            display: flex;
            gap: .5rem;
            overflow-x: auto;
            scrollbar-width: none
        }

            .thumbs button {
                flex: 0 0 auto;
                width: 4.75rem;
                aspect-ratio: 16/9;
                padding: 0;
                border: 2px solid transparent;
                border-radius: 0;
                overflow: hidden;
                background: var(--bg);
                color: var(--fg);
                font: inherit;
                font-size: .85rem;
                cursor: pointer;
                opacity: .7
            }

                .thumbs button[aria-current=true] {
                    border-color: var(--acc);
                    opacity: 1
                }

            .thumbs img {
                display: block;
                width: 100%;
                height: 100%;
                object-fit: cover
            }

        .novid {
            color: var(--mut);
            padding: 1rem;
            text-align: center
        }

        .txt {
            display: flex;
            flex-direction: column;
            gap: .9rem;
            padding: .5rem .5rem .5rem 0
        }

        .date {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: .35rem .6rem;
            color: var(--mut);
            font-size: .95rem
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            padding-left: .6rem;
            border-left: 1px solid var(--line)
        }

            .status::before {
                content: "";
                width: .45rem;
                height: .45rem;
                border-radius: 50%;
                background: var(--mut);
                opacity: .6
            }

            .status[data-state=ongoing]::before {
                background: var(--hot);
                opacity: 1
            }

            .status[data-state=done]::before {
                background: #43c06a;
                opacity: 1
            }

        .txt h3 {
            font-size: clamp(1.7rem,3.2vw,2.3rem);
            line-height: 1.05;
            font-weight: 800;
            letter-spacing: -.025em
        }

        dl {
            margin-top: auto;
            border-top: 1px solid var(--line);
            padding-top: .9rem;
            display: grid;
            grid-auto-flow: column;
            grid-auto-columns: minmax(0,1fr);
            gap: .9rem 1.5rem
        }

        dt {
            color: var(--mut);
            font-size: .95rem
        }

        dd {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--hot)
        }

        .team {
            container-type: inline-size;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: .1rem .3rem;
            min-height: calc(1.4rem * 1.6)
        }

            /* --n = number of icons: each one takes its share of the free width, between .8rem and 1.45rem */
            .team svg {
                display: block;
                flex: none;
                width: clamp(.8rem, calc((100cqw - (var(--n) - 1) * .3rem) / var(--n)), 1.45rem);
                aspect-ratio: 1;
                height: auto;
                fill: currentColor
            }

        footer {
            max-width: 1100px;
            margin: 0 auto;
            padding: 1rem 1.5rem clamp(1rem,4svh,3rem);
            color: var(--mut);
            font-size: .95rem
        }

        @media (max-width:760px) {
            header {
                grid-template-columns: 1fr;
                gap: 1.5rem
            }

            .slide {
                grid-template-columns: 1fr;
                gap: 1rem
            }

            .txt {
                padding: 0 .25rem .25rem
            }
        }





        html {
            scroll-behavior: smooth
        }

        @media (prefers-reduced-motion:reduce) {
            html {
                scroll-behavior: auto
            }
        }

        .page {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            flex-direction: column
        }

        .about header {
            width: min(1100px,calc(100% - 3rem));
            max-width: none;
            margin: auto;
            padding: clamp(1.5rem,4vw,3rem);
            align-items: center;
            background: var(--glass);
            -webkit-backdrop-filter: var(--glass-fx);
            backdrop-filter: var(--glass-fx);
            border: 1px solid var(--glass-line);
            border-radius: 0
        }

        .cue {
            align-self: center;
            padding: 1.5rem;
            color: var(--mut);
            text-decoration: none
        }

            .cue:hover {
                color: var(--fg)
            }

        #projects .body {
            margin-block: auto;
            padding-block: clamp(.5rem,3svh,2rem)
        }

        footer {
            display: flex;
            justify-content: space-between;
            width: 100%
        }

        /* Diamond pattern: background only (z-index 0 < .page at 1), never above content */
        .grid-base, .grid-fx {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none
        }

        @media (hover:none) {
            .grid-fx {
                display: none
            }
        }

        /* ===== Vertical wheel + timeline ===== */
        .stage {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 1.5rem;
            display: grid;
            grid-template-columns: 8rem minmax(0,1fr);
            column-gap: 1.75rem
        }

        .deck {
            display: flex;
            align-items: center;
            gap: 1rem;
            min-width: 0
        }

        /* Timeline: detached from the projects by the grid gap; the scale is readable (neighbouring dates are labelled) */
        .timeline {
            position: relative;
            overflow: hidden;
            -webkit-mask-image: linear-gradient(transparent, #000 18%, #000 82%, transparent);
            mask-image: linear-gradient(transparent, #000 18%, #000 82%, transparent)
        }

            .timeline::after {
                content: "";
                position: absolute;
                right: 0;
                top: 0;
                bottom: 0;
                width: 2px;
                background: rgba(255,255,255,.2)
            }

        .ticks i {
            position: absolute;
            right: 0;
            top: 50%;
            width: .7rem;
            height: 2px;
            background: rgba(255,255,255,.5)
        }

            .ticks i span {
                font-style: normal;
                position: absolute;
                right: calc(100% + .7rem);
                top: 50%;
                transform: translateY(-50%);
                white-space: nowrap;
                font-size: .82rem;
                line-height: 1;
                font-weight: 700;
                font-variant-numeric: tabular-nums;
                color: #b4b4bc;
                text-shadow: 0 0 10px var(--bg), 0 0 4px var(--bg)
            }

        .mark {
            position: absolute;
            right: 0;
            top: 50%;
            width: 1.6rem;
            height: 4px;
            margin-top: -2px;
            background: var(--acc);
            box-shadow: 0 0 12px rgba(255,61,46,.55)
        }

        .when {
            position: absolute;
            right: 2.2rem;
            top: 50%;
            transform: translateY(-50%);
            text-align: right;
            line-height: 1;
            text-shadow: 0 0 12px var(--bg), 0 0 4px var(--bg)
        }

            .when .m {
                display: block;
                font-size: 1.7rem;
                font-weight: 800;
                letter-spacing: -.02em;
                color: var(--fg)
            }

            .when .y {
                display: block;
                margin-top: .3rem;
                font-size: 1rem;
                font-weight: 700;
                color: var(--hot)
            }

        .wheel {
            --peek: clamp(2rem, 7svh, 3.75rem);
            width: min(100%, 1000px, max(560px, calc(1000px - (700px - 100svh) * 3)));
            flex: 0 1 auto;
            min-width: 0;
            display: grid;
            grid-template-columns: minmax(0,1fr);
            padding-block: var(--peek);
            overflow: hidden;
            perspective: 1400px;
            touch-action: none;
            cursor: grab
            /* no mask here: a mask on an ancestor would stop the slides' backdrop blur from seeing the diamond background.
               The fade at the top and bottom is done by each slide's own opacity instead (see draw()) */
        }

            .wheel.drag {
                cursor: grabbing;
                user-select: none
            }

        .date .status {
            padding-left: 0;
            border-left: 0
        }

        @media (max-width:760px) {
            .stage {
                grid-template-columns: 2.4rem minmax(0,1fr);
                column-gap: .6rem;
                padding: 0 1rem
            }

            .deck {
                gap: .5rem
            }

            .arrows button {
                width: 2.25rem;
                height: 2.25rem
            }

            .mark {
                width: .9rem
            }

            .ticks i span {
                display: none
            }

            .when {
                right: 1rem;
                writing-mode: vertical-rl;
                transform: translateY(-50%) rotate(180deg);
                white-space: nowrap
            }

                .when .m, .when .y {
                    display: inline;
                    font-size: .95rem
                }

                .when .y {
                    margin: 0 0 0 .4em
                }
        }
    </style>
</head>
<body>

    <section class="page about" id="about">
        <header>
            <div>
                <h1 id="name"></h1>
                <p class="title" id="title"></p>
                <ul class="links" id="links"></ul>
            </div>
            <div class="bio" id="bio"></div>
        </header>
        <a class="cue" href="#projects">Projects ↓</a>
    </section>

    <main class="page" id="projects">
        <div class="body">
            <div class="projects-head">
                <h2 class="section">Projects</h2>
            </div>
            <nav class="menu" id="menu" aria-label="Project list"></nav>
            <div class="stage">
                <div class="timeline" aria-hidden="true">
                    <div class="ticks" id="ticks"></div>
                    <span class="mark"></span>
                    <time class="when" id="when"></time>
                </div>
                <div class="deck">
                    <div class="wheel" id="track" tabindex="0" role="group" aria-label="Projects, newest at the top. Swipe up or scroll down for older ones"></div>
                    <div class="arrows">
                        <button id="prev" aria-label="Newer project">↑</button>
                        <button id="next" aria-label="Older project">↓</button>
                    </div>
                </div>
            </div>
        </div>
        <footer><span id="copy"></span><a href="#about">↑ About</a></footer>
    </main>

    <canvas class="grid-base" id="gridBase" aria-hidden="true"></canvas>
    <canvas class="grid-fx" id="gridFx" aria-hidden="true"></canvas>

    <script>
        /* ====== EDIT THIS: your information ====== */
        const PROFILE = {
        name: "Ludwig Gurget",
        title: "23 y/o Gameplay Programmer (3rd-year student) specializing in C++ and C#.",
        // Portrait shown next to your bio. Put the image in the repo next to index.html
        // (default file name: photo.jpg). If the file is missing, no photo is shown.
        photo: "photo.jpg",
        bio: [
        "I design and program gameplay systems, editor tools and interactive experiences in Unity and Unreal Engine 5.",
        "I love small details that make a huge difference and well-crafted systems like an animation that reacts to the player, a tool that saves the team an hour, a prototype that holds together. And if a button could make you a coffee, I'd build it in a heartbeat",
        "Like many in this industry, my passion for video games naturally led me to study game development, where I gained some good technical foundation."
        ],
        links: [
        { label: "GitHub", url: "https://github.com/HiItsFeu" },
        { label: "LinkedIn", url: "https://www.linkedin.com/in/ludwig-gurget-769787261" },
        { label: "Contact", url: "mailto:l.gurget@gmail.com" }
        ]
        };

        /* One object per project.
        order    : display position. 1 = shown first (the page opens on it, on the right), 2 = the next one
        you reach by scrolling right, and so on. Projects without "order" come last, newest first.
        date     : "YYYY-MM" (shown on the slide, also used to break ties between equal orders)
        duration : free text, e.g. "3 weeks"
        team     : number of people who worked on the project, e.g. 1 (shown as "Solo") or 4 (shown as "4 people").
        Free text also works, e.g. "4 (2 programmers, 2 artists)". Leave null to hide the line.
        ongoing  : true if the project is still in production (shows "In progress" next to the date).
        Leave it out (or false) for a finished project (shows "Completed").
        video    : a YouTube link (youtube.com or youtu.be) OR a file in the repo, e.g. "videos/demo.mp4".
        Leave "" if there is none.
        videos   : (optional) several videos, same format as "video",
        e.g. ["https://youtu.be/AAAAAAAAAAA", "videos/demo.mp4"].
        You can use "video", "videos" or both (the single "video" comes first).
        photos   : list of images in the repo, e.g. ["images/shot1.jpg", "images/shot2.jpg"].
        They appear with the videos in a small gallery (videos first). Leave [] if there are none.
        link     : (optional) repository or project page */
        const PROJECTS = [
        { name: "CPU Engine", order: 1, date: "2026-11", duration: "1 month", team: "2",
        bio: "C++ software engine running entirely on the CPU using SDL3. Framebuffer management, custom rasterizer, multri-threading, blinn-phong lighting, multiple lights, terrain generation.",
        video: "https://youtu.be/hFcULMIPu58", photos: [], link: "" },
        { name: "A simple slime", order: 2, date: "2026-10", duration: "3 weeks", team: "2",
        bio: "A Unity game prototype focused on game feel and core gameplay mechanics, featuring a custom-built character controller.",
        video: "https://www.youtube.com/watch?v=g6VkB29s6fE", photos: [], link: "" },
        { name: "Fps prototype", order: 3, date: "2026-08", duration: "1 month", team: null,
        bio: "A compact FPS prototype built in Unreal Engine 4, created to test my ability to scope and execute a project under a strict timeline.",
        video: "https://www.youtube.com/watch?v=nlRbgm4-v0M", photos: [], link: "" },
        { name: "Guadeloupe: The Secret of the Three Rivers", order: 4, date: "2026-07", duration: "1 month", team: "4",
        bio: "Internship project at Black Frog Studio. An exploration game centered on Guadeloupe's rich folklore, where players travel across the island to solve its mysteries. Developed custom internal tools for level designers.",
        video: "https://www.youtube.com/watch?v=zlhlM9s28EE", photos: [], link: "" },
        { name: "Spline Tools (UE5)", order: 5, date: "2026-07", duration: "2 weeks", team: null,
        bio: "A suite of C++ and Blueprint editor tools for Unreal Engine 5, featuring terrain-spline snapping, curve-based movement, and highly configurable parameters.",
        videos: ["https://www.youtube.com/watch?v=yAbLEiAEBwk", "https://www.youtube.com/watch?v=c-JQNT7x82A"], photos: [], link: "" },
        { name: "Dialogue and Cutscene System", order: 6, date: "2026-06", duration: "1 week", team: null,

        videos: ["https://www.youtube.com/watch?v=2vAAXGh2Jo8", "https://www.youtube.com/watch?v=SifTLRT01S0"], photos: [], link: "" },
        { name: "Turbo Drift 2", order: 7, date: "2026-05", duration: "Undefined", team: null, ongoing: true,
        bio: "A racing game derived from my student project Turbo Drift. As my most ambitious project to date, built in Unreal Engine 5.7, everything was created from scratch—from 3D art pipelines in Blender to core gameplay programming.",
        video: "", photos: ["Pictures/Test4.png" , "Pictures/SideView.png" , "Pictures/OrthoView.png" , "Pictures/TopView.png"], link: "" },
        { name: "Turbo Drift", order: 8, date: "2026-04", duration: "1 month", team: "6",
        bio: "A racing game prototype built on a handmade C++ and Vulkan engine, featuring custom vehicle audio and 3D assets created by the art team.",
        videos: ["https://www.youtube.com/watch?v=UNN34BJ2Xj8", "https://www.youtube.com/watch?v=o79piqJLBgM"], photos: [], link: "" },

        ];
        /* ====== End of the editable area ====== */

        const $ = id => document.getElementById(id);
        const el = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };
        const monthFmt = new Intl.DateTimeFormat("en", { month: "long", year: "numeric" });
        const monthShort = d => d.toLocaleString("en", { month: "long" }).slice(0, 3);   // first 3 letters only
        const ytId = u => (u.match(/(?:youtu\.be\/|[?&]v=|embed\/)([\w-]{11})/) || [])[1];
        const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;

        /* Profile */
        document.title = PROFILE.name + " – Portfolio";
        $("name").textContent = PROFILE.name;
        $("title").textContent = PROFILE.title;
        if (PROFILE.photo) {
        const img = el("img", "photo");
        img.src = PROFILE.photo; img.alt = "Portrait of " + PROFILE.name;
        img.onerror = () => img.remove();
        $("bio").append(img);
        }
        PROFILE.bio.forEach(p => $("bio").append(el("p", "", p)));
        PROFILE.links.forEach(l => {
        const li = el("li"), a = el("a", "", l.label);
        a.href = l.url;
        if (!l.url.startsWith("mailto:")) { a.target = "_blank"; a.rel = "noopener"; }
        li.append(a); $("links").append(li);
        });
        $("copy").textContent = "© " + new Date().getFullYear() + " " + PROFILE.name;

        /* Team size: one simplified person icon per team member (free text without a leading number stays text) */
        const SVG = "http://www.w3.org/2000/svg";

        addEventListener("pointermove", e => {
        if (e.pointerType !== "mouse") return;
        tx = e.clientX; ty = e.clientY;
        if (!inside) { inside = true; if (!running) { mx = tx; my = ty; } }
        start();
        });
        document.documentElement.addEventListener("pointerleave", () => { inside = false; if (prev) start(); });
        })();
    </script>
</body>
